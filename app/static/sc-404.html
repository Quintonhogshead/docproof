<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost the Trail — Spell &amp; Check</title>
<meta name="description" content="This page wandered off the map. Galley will walk you back.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/art/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/assets/art/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/art/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/assets/sc-shared.css">
<style>
  .lost{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s5);align-items:center;
    padding:var(--s7) 0 var(--s5)}
  .lost .lantern-art{color:var(--ink)}
  .lost .lantern-art .art-figure{display:block;width:100%;filter:drop-shadow(0 2px 0 var(--line))}
  .lost .code{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.22em;color:var(--dim)}
  .lost h1{font-size:var(--fs-h1);margin:8px 0 12px}
  @media (max-width:640px){.lost{grid-template-columns:1fr;gap:var(--s3);text-align:left}.lost .lantern-art{max-width:150px}}
</style>
</head>
<body data-page="404">
<div class="wrap">

  <section class="lost">
    <div class="lantern-art"><span class="art-figure" data-art="galley"></span></div>
    <div>
      <div class="code">Error 404 · off the map</div>
      <h1>This page wandered off.</h1>
      <p class="lede">Galley lifted her lantern and found nothing here — the page you're after
      has moved, or was never charted. No harm done; the trail home is just ahead.</p>
      <p class="hero-cta">
        <a class="btn" href="/">Back to the beginning</a>
        <a class="btn ghost" href="/quote">Bring me your book</a>
      </p>
    </div>
  </section>

</div>
<script src="/assets/sc-shared.js"></script>
</body>
</html>
