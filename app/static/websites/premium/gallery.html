<html lang="en">
<head>

  <title>Witch in the Wall · Five Premium Website Directions</title>
  <meta name="description" content="Five complete premium author website concepts for Quinn Hogshead, with an interactive email signup preview.">
  <style>
    :root{color-scheme:light;font:16px/1.45 Arial,Helvetica,sans-serif;--ink:#17242a;--muted:#536168;--line:#d4dbde;--accent:#235b69}
    *{box-sizing:border-box}body{margin:0;background:#edf0f1;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #277d94;outline-offset:4px}button{color:inherit}h1,h2,p{margin:0}button:disabled{cursor:default}a{color:inherit}.masthead{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 32px;border-bottom:1px solid var(--line);background:#fff}.studio-wordmark{display:flex;align-items:center;gap:13px}.studio-mark{display:block;width:25px;height:25px;border:1px solid #647d89;border-radius:50%;box-shadow:inset 5px 0 0 #fff,inset 6px 0 0 #647d89}.studio-name{font:21px/1 Georgia,serif;letter-spacing:-.025em}.studio-name small{font:12px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.15em;margin-left:12px;color:var(--muted)}.mast-actions{display:flex;gap:10px;align-items:center}.artifact-label{font-size:12px;color:var(--muted)}.small-button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:4px;font-size:14px;line-height:1.3;min-height:39px}.small-button:hover{border-color:#60757f}.small-button.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.review-intro{display:flex;justify-content:space-between;align-items:center;gap:25px;padding:22px 32px 18px}.review-intro h1{font-size:23px;letter-spacing:-.035em;font-weight:500}.review-intro h1 em{font-family:Georgia,serif;font-weight:400}.review-intro p{font-size:14px;color:var(--muted);margin-top:5px}.compare-control{display:flex;gap:9px;align-items:center;font-size:14px;white-space:nowrap}.compare-control input{width:17px;height:17px;accent-color:#234e5e}.theme-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:0 32px 20px}.theme-card{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:5px;min-height:73px;position:relative}.theme-card[aria-pressed=true]{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}.theme-card:hover{border-color:#647985}.theme-swatch{height:37px;width:28px;flex:0 0 28px;border-radius:2px;background:var(--swatch);border:1px solid #0001}.theme-card strong{display:block;font-family:Georgia,serif;font-size:19px;font-weight:400;line-height:1.1;letter-spacing:-.02em}.theme-card small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}.theme-card .selection-mark{display:none;position:absolute;right:7px;top:7px;width:13px;height:13px;border:1px solid #6f8088;border-radius:2px}.compare-on .theme-card .selection-mark{display:block}.theme-card[aria-pressed=true] .selection-mark{background:var(--ink)}.toolbar{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#edf0f1ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 32px}.toolbar-group{display:flex;gap:5px;align-items:center}.toolbar-group button{background:none;border:0;border-radius:4px;padding:9px 13px;font-size:14px;white-space:nowrap}.toolbar-group button[aria-pressed=true]{background:#fff;box-shadow:0 1px 5px #0001;color:#123e4a}.toolbar-group button:hover{background:#fff}.toolbar-right{display:flex;gap:12px;align-items:center}.segmented{border:1px solid var(--line);padding:3px;border-radius:5px}.segmented button{padding:5px 9px;font-size:13px}.toolbar-popup{border-color:#abc4cc;color:#174c5c}.gallery{display:grid;grid-template-columns:1fr;gap:20px;padding:22px 32px 30px}.gallery.compare{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery.mobile{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.preview-pane{min-width:0;border:1px solid #9caeb5;border-radius:7px;background:#fff;overflow:hidden;box-shadow:0 12px 35px #18313c15}.pane-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:8px 13px;border-bottom:1px solid #d0d9dd;min-height:36px;font-size:12px}.pane-bar p{display:flex;align-items:center;gap:8px;color:#42565f}.pane-dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--swatch);border:1px solid #0002}.pane-bar button{background:none;border:0;color:#315763;padding:3px 0;font-size:12px;text-decoration:underline;text-underline-offset:3px}.viewport-stage{position:relative;overflow:hidden;background:#fff}.native-viewport{position:absolute;top:0;left:0;transform-origin:top left}iframe{width:100%;height:100%;border:0;display:block;background:#fff}.preview-pane.is-mobile{width:min(100%,414px);justify-self:center;border:7px solid #24353e;border-radius:28px}.is-mobile .pane-bar{border:0;background:#24353e;color:white;padding:3px 9px 9px}.is-mobile .pane-bar p,.is-mobile .pane-bar button{color:#edf4f6}.is-mobile .viewport-stage{border-radius:16px}.review-footer{display:flex;justify-content:space-between;gap:24px;padding:0 32px 26px;font-size:12px;color:var(--muted)}.status{font-size:12px;padding:0 32px;margin-top:15px;color:var(--muted)}.focus-mode .masthead,.focus-mode .review-intro,.focus-mode .theme-list,.focus-mode .review-footer,.focus-mode .status{display:none}.focus-mode .toolbar{padding-block:9px}.focus-mode .gallery{padding:0;gap:8px}.focus-mode .preview-pane{border-radius:0;border:0;box-shadow:none}.focus-mode .pane-bar{display:none}.focus-mode .preview-pane.is-mobile{margin-top:10px;border:7px solid #24353e;border-radius:24px}.download-feedback{font-size:12px;color:var(--accent)}[hidden]{display:none!important}
    @media(max-width:1050px){.masthead,.review-intro{padding-inline:20px}.theme-list{padding-inline:20px;gap:8px}.theme-card{padding:13px 10px;gap:8px}.theme-card strong{font-size:17px}.theme-swatch{width:20px;flex-basis:20px}.theme-card small{font-size:12px}.toolbar{padding-inline:20px;gap:8px}.toolbar-group button{padding:8px 9px}.toolbar-right{gap:7px}.toolbar-popup{font-size:13px;padding-inline:10px}.gallery{padding-inline:20px}.artifact-label{display:none}.studio-name small{font-size:12px}.review-footer{padding-inline:20px}}
    @media(max-width:800px){.theme-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theme-card{min-height:72px}.theme-card strong{font-size:19px}.toolbar{flex-wrap:wrap}.toolbar-right{margin-left:auto}.toolbar-group button{font-size:14px}.gallery.compare{grid-template-columns:1fr}.gallery.mobile{grid-template-columns:1fr}.review-intro h1{font-size:21px}.studio-name small{display:none}.review-footer{flex-direction:column;gap:8px}.status{padding-inline:20px}}
    @media(max-width:520px){.masthead{padding:15px}.mast-actions .small-button{font-size:13px;padding:8px 10px}.studio-mark{width:21px;height:21px}.studio-name{font-size:21px}.studio-wordmark{gap:9px}.review-intro{padding:20px 15px 16px;align-items:flex-start;flex-direction:column;gap:14px}.review-intro h1{font-size:23px}.theme-list{padding-inline:15px;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.theme-card:last-child{grid-column:1/-1}.theme-card{padding:13px 12px}.theme-card strong{font-size:20px}.theme-card small{font-size:12px}.toolbar{padding:10px 12px;gap:8px;position:static}.toolbar-right{margin-left:0;width:100%;justify-content:space-between}.toolbar-group{gap:2px}.toolbar-group button{padding:9px 10px}.toolbar-popup{font-size:13px}.gallery{padding:15px 10px}.pane-bar{padding:8px 10px}.review-footer{padding-inline:15px}.status{padding-inline:15px}.focus-mode .toolbar{position:sticky}.focus-mode .gallery{padding:0}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="masthead"><div class="studio-wordmark"><span class="studio-mark" aria-hidden="true"></span><div class="studio-name">Atmosphere <small>Website Studio</small></div></div><div class="mast-actions"><span class="artifact-label">One file · opens offline</span><button class="small-button dark" id="download">Save this HTML ↓</button></div></header>
  <section class="review-intro"><div><h1>Five directions for <em>Witch in the Wall.</em></h1><p>Quinn Hogshead · Premium website concepts</p></div><label class="compare-control"><input type="checkbox" id="compare-toggle"> Compare multiple designs</label></section>
  <div class="theme-list" id="theme-list" role="group" aria-label="Choose website designs"></div>
  <section class="toolbar" aria-label="Preview controls"><div class="toolbar-group" id="page-controls" role="group" aria-label="Website page"><button data-page="home" aria-pressed="true">Home</button><button data-page="books" aria-pressed="false">The book</button><button data-page="about" aria-pressed="false">The author</button><button data-page="contact" aria-pressed="false">Contact</button></div><div class="toolbar-right"><div class="toolbar-group segmented" id="size-controls" role="group" aria-label="Preview size"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button></div><button class="small-button toolbar-popup" id="popup">Try email pop-up ↗</button><button class="small-button" id="focus" aria-pressed="false">Expand ⤢</button></div></section>
  <p class="status" id="status" aria-live="polite"></p>
  <main class="gallery" id="gallery" aria-label="Premium website previews"></main>
  <footer class="review-footer"><span>All five designs include Home, The book, The author, and Contact.</span><span>Email signups are interactive demonstrations. No email is collected.</span></footer>
  <script type="application/json" id="review-data">__PREMIUM_DATA__</script>
  <script>
  (() => {
    const originalHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
    const data = JSON.parse(document.getElementById('review-data').textContent);
    const themes = data.themes;
    const pageLabels = {home:'Home',books:'The book',about:'The author',contact:'Contact'};
    const validPages = new Set(Object.keys(pageLabels));
    const state = {selected:['nocturne'],page:'home',size:'desktop',compare:false,focus:false};
    const gallery = document.getElementById('gallery');
    const records = [];
    const bridge = `<script>
      document.addEventListener('click', event => {
        const link = event.target.closest?.('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        const match = href.match(/^#(home|books|about|contact)$/);
        if (match) {
          event.preventDefault();
          parent.postMessage({type:'premium:navigate',page:match[1]},'*');
          return;
        }
        if (href.startsWith('#')) {
          const target = document.getElementById(href.slice(1));
          if (target) {
            event.preventDefault();
            target.scrollIntoView();
            if (href === '#main') { target.tabIndex = -1; target.focus({preventScroll:true}); }
          }
        }
      });
    <\/script>`;
    const csp = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">`;
    function prepare(source) {
      let html = source.replace('__FONTS__',data.fontCss);
      html = html.replace(/__ASSET__\/([A-Za-z0-9_.-]+)/g,(_,id)=>{if(!data.assets[id])throw new Error('Missing review asset: '+id);return data.assets[id]});
      return html.replace('<head>','<head>'+csp).replace('</body>',bridge+'</body>');
    }
    function fit(record) {
      const width=state.size==='mobile'?390:1280;
      const available=record.stage.clientWidth;
      if (!available) return;
      const scale=available/width;
      const height=state.focus?Math.max(480,(window.innerHeight-document.querySelector('.toolbar').offsetHeight-(state.size==='mobile'?25:0))/scale):(state.size==='mobile'?820:880);
      record.stage.style.height=Math.ceil(height*scale)+'px';
      Object.assign(record.native.style,{width:width+'px',height:height+'px',transform:'scale('+scale+')'});
    }
    const ro=new ResizeObserver(entries=>entries.forEach(entry=>{const record=records.find(r=>r.stage===entry.target);if(record)fit(record)}));
    function syncControls() {
      document.querySelectorAll('[data-theme]').forEach(button=>button.setAttribute('aria-pressed',String(state.selected.includes(button.dataset.theme))));
      document.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.page===state.page)));
      document.querySelectorAll('[data-size]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.size===state.size)));
      document.getElementById('compare-toggle').checked=state.compare;
      document.body.classList.toggle('compare-on',state.compare);
      const chosen=themes.filter(t=>state.selected.includes(t.id));
      document.getElementById('status').textContent=chosen.map(t=>t.name).join(' + ')+' · '+pageLabels[state.page]+' · '+(state.size==='mobile'?'390 px phone preview':'1280 px desktop preview');
    }
    function render() {
      ro.disconnect();records.length=0;gallery.replaceChildren();
      gallery.className='gallery'+(state.selected.length>1?' compare':'')+(state.size==='mobile'?' mobile':'');
      themes.filter(t=>state.selected.includes(t.id)).forEach(theme=>{
        const pane=document.createElement('article');pane.className='preview-pane'+(state.size==='mobile'?' is-mobile':'');pane.style.setProperty('--swatch',theme.color);pane.setAttribute('aria-label',theme.name+' website');
        const bar=document.createElement('div');bar.className='pane-bar';
        const label=document.createElement('p');const dot=document.createElement('span');dot.className='pane-dot';label.append(dot,document.createTextNode(theme.name+' / '+pageLabels[state.page]));
        const button=document.createElement('button');button.textContent='Preview signup ↗';button.setAttribute('aria-label','Preview '+theme.name+' email signup');
        const stage=document.createElement('div');stage.className='viewport-stage';const native=document.createElement('div');native.className='native-viewport';const frame=document.createElement('iframe');
        frame.title=theme.name+' — '+pageLabels[state.page];frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox');frame.srcdoc=prepare(data.pages[theme.id][state.page]);
        button.addEventListener('click',()=>frame.contentWindow.postMessage({type:'premium:signup'},'*'));
        bar.append(label,button);native.append(frame);stage.append(native);pane.append(bar,stage);gallery.append(pane);
        const record={theme:theme.id,frame,stage,native};records.push(record);ro.observe(stage);requestAnimationFrame(()=>fit(record));
      });syncControls();
    }
    themes.forEach(theme=>{
      const button=document.createElement('button');button.type='button';button.className='theme-card';button.dataset.theme=theme.id;button.style.setProperty('--swatch',theme.color);button.setAttribute('aria-pressed','false');
      const swatch=document.createElement('span');swatch.className='theme-swatch';swatch.setAttribute('aria-hidden','true');const copy=document.createElement('span');const title=document.createElement('strong');title.textContent=theme.name;const desc=document.createElement('small');desc.textContent=theme.description;const mark=document.createElement('span');mark.className='selection-mark';mark.setAttribute('aria-hidden','true');copy.append(title,desc);button.append(swatch,copy,mark);
      button.addEventListener('click',()=>{if(!state.compare)state.selected=[theme.id];else if(state.selected.includes(theme.id)){if(state.selected.length===1)return;state.selected=state.selected.filter(id=>id!==theme.id)}else state.selected.push(theme.id);render()});
      document.getElementById('theme-list').append(button);
    });
    document.getElementById('compare-toggle').addEventListener('change',event=>{state.compare=event.target.checked;if(!state.compare)state.selected=[state.selected[0]];render()});
    document.getElementById('page-controls').addEventListener('click',event=>{const button=event.target.closest('[data-page]');if(!button)return;state.page=button.dataset.page;render()});
    document.getElementById('size-controls').addEventListener('click',event=>{const button=event.target.closest('[data-size]');if(!button)return;state.size=button.dataset.size;render()});
    document.getElementById('popup').addEventListener('click',()=>records.forEach(record=>record.frame.contentWindow.postMessage({type:'premium:signup'},'*')));
    document.getElementById('focus').addEventListener('click',event=>{state.focus=!state.focus;document.body.classList.toggle('focus-mode',state.focus);event.currentTarget.setAttribute('aria-pressed',String(state.focus));event.currentTarget.textContent=state.focus?'Back to designs ↙':'Expand ⤢';window.scrollTo(0,0);records.forEach(fit)});
    window.addEventListener('message',event=>{if(event.data?.type!=='premium:navigate'||!validPages.has(event.data.page)||!records.some(record=>record.frame.contentWindow===event.source))return;state.page=event.data.page;render()});
    window.addEventListener('resize',()=>records.forEach(fit));
    document.getElementById('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([originalHtml],{type:'text/html;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='Witch-in-the-Wall-Premium-Website-Review.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
    render();
  })();
  </script>
</body>
</html>
