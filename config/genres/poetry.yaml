# Posture preset: poetry.
#
# The softest posture on the shelf, paired with `--stage poetry-touch`. Verse
# takes the house MECHANICS at the character and word level (dashes,
# ellipses, apostrophes, spaces, spelling, compounds, serial comma, role
# capitals, times, ranges, spelled-out numbers, quote pairs) and never a
# change to its STRUCTURE (line breaks, line-head capitals, fragments,
# terminal punctuation, repetition, coinages, dialect). This overlay only sets
# what a genre may set — the stylistic posture — and sets all of it to "offer
# nothing": strict flights, no smoothing, no rewrite. Which lanes run is the
# stage's business, not the genre's.
name: poetry
description: >
  Verse posture: house mechanics only, never the poem's structure. Strict
  flights, no smoothing, no rewrite — and always composed with
  `--stage poetry-touch`, which runs the mechanics passes and locks the
  sentence-level lanes off.

overlay:
  flights.posture: strict
  smoothing.enabled: false
  rewrite.enabled: false
