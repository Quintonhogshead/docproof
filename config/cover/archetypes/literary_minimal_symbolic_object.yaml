# Research: SPINE Magazine's named 2025 list (Fools for Love, Blob, On the
# Clock, and others) plus Sally Rooney's "Intermezzo" US edition (design by
# June Park) — a small object on a flat, near-monochrome ground under an
# oversized "old-school Big Book" title. Confidence: high (docs/
# cover_template_research.md #13).
name: literary_minimal_symbolic_object
genres: [literary]
describe: >-
  One small, slightly surreal object floats off to one side; an oversized
  editorial title claims the top third, author the bottom — highly
  asymmetric, 80%+ unbroken flat color.
composition_note: >-
  One small, often slightly distorted or surreal object — a warped
  everyday item, a single creature, a fragment — off-center on a flat,
  single-color, near-monochrome background. Not a scene: just the object
  and color. Leave the rest of the frame completely empty and unbroken.
  No text anywhere.
art:
  - id: background
    generatable: true            # one near-monochrome flat hue; procedural
    fit: cover                   # gradient is a fair $0 stand-in
  - id: texture
    generatable: false           # v2.1 BODY-fix wave: quiet paper grain
    fit: cover                   # (reference DNA item 7) — the "80%+
    procedural: paper            # unbroken flat color" the describe line
    opacity: 0.5                 # promises should still feel like paper,
    blend: overlay               # not a screen, once it is actually empty
  - id: focal
    generatable: true
    fit: contain
    transparent: true            # one small object, not a scene
    # v2.1 BODY-fix wave: ONE object, centered at the optical center
    # (x 0.35->0.5, y 0.7->0.52 — "Theo of Golden"'s own shape) rather than
    # off in a corner; scale up (0.26->0.34) so it actually anchors that
    # center instead of reading as a stray mark near it.
    anchor: [0.5, 0.52]
    scale: 0.34
text:
  - id: title
    zone: {x: 0.08, y: 0.08, w: 0.84, h: 0.22}
    align: left                  # asymmetric, editorial — not centered
    size_min: 0.05
    size_max: 0.14                # "sometimes deliberately oversized"
    max_lines: 3
  - id: subtitle
    zone: {x: 0.08, y: 0.31, w: 0.80, h: 0.035}
    align: left
    optional: true
    size_min: 0.016
    size_max: 0.022
  - id: author
    # v2.1 BODY-fix wave: nudged up (0.90 -> 0.80) — the object's own
    # optical-center placement (anchor y 0.52) left a wide, genuinely empty
    # stretch below it before author picked back up; still reads as
    # bottom-anchored relative to the object above it.
    zone: {x: 0.08, y: 0.80, w: 0.60, h: 0.05}
    align: left
    tracking: 20
    size_min: 0.020
    size_max: 0.030
layers: [background, texture, focal, title, subtitle, author]
