# Research: DAMONZA/Spokesman-sourced "60% rise" in expressive illustrated-
# character romance jackets vs. 2023; Emily Henry's "Great Big Beautiful
# Life" (2025, design by Devyn Glista/St. Blanc Studios) as a current
# bestseller-tier anchor. Confidence: high (docs/cover_template_research.md #7).
name: romcom_maximalist_layered
genres: [romance]
describe: >-
  A close, expressive illustrated character (or couple) in a full layered
  saturated scene, with a carved-out gap for a banded lower-third title —
  the busier, warmer sibling of the flat-vector romance look.
composition_note: >-
  A close, warm, expressively illustrated character or couple set within a
  full layered scene — foreground floral or object detail, mid-ground
  figure, background sky or skyline. Deliberately leave a clear patch of
  sky, wall, or open color in the lower third, sized to hold large title
  text without competing linework behind it. No text anywhere.
art:
  - id: background
    generatable: true
    fit: cover
  - id: texture
    generatable: false           # procedural film grain (§7.3), kept subtle
    opacity: 0.05                # so it reads as soft illustration texture
    blend: overlay               # rather than dulling the saturated palette
text:
  - id: title
    zone: {x: 0.08, y: 0.66, w: 0.84, h: 0.16}
    case: upper
    tracking: 40
    size_min: 0.045
    size_max: 0.11
    max_lines: 3
    # No scrim habit here — the research names a drop shadow, not a scrim
    # box, as the convention. The composition_note carves the gap; this
    # shadow is the designed legibility strategy, not just the autopilot's
    # busy-backdrop fallback (compose.py adds one of these automatically
    # anyway when stddev runs high, but naming it here makes the intent
    # explicit rather than incidental).
    shadow: {alpha: 0.4}
  - id: subtitle
    zone: {x: 0.10, y: 0.83, w: 0.80, h: 0.04}
    optional: true
    size_min: 0.016
    size_max: 0.024
  - id: author
    zone: {x: 0.10, y: 0.90, w: 0.80, h: 0.05}
    case: upper
    tracking: 130
    size_min: 0.018
    size_max: 0.028
layers: [background, texture, title, subtitle, author]
