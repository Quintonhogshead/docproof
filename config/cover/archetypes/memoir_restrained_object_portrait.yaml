# Research: "Childless" by Fabiana Formica (Reedsy, 20 Best Book Covers of
# 2025) — the author's face front-and-center with minimal design, plus an
# explicit design-philosophy note that grief/recovery memoirs read best
# through restraint: muted palette, a single charged object, generous
# breathing room. Confidence: high (docs/cover_template_research.md #15).
name: memoir_restrained_object_portrait
genres: [memoir_biography]
describe: >-
  A restrained cropped portrait or single charged object fills the upper
  half; title and an almost-as-prominent author name cluster quietly in
  the generous open space below. No scrim — restraint is the strategy.
composition_note: >-
  Either a simply cropped portrait treatment or a single charged object
  standing in for the whole story — a chair, a piece of clothing, a
  hand — rendered simply, centered in the upper half of the frame, with
  at least a third of the canvas left as plain, unbroken, restful color
  beneath it. No text anywhere.
art:
  - id: background
    generatable: true
    fit: cover
  - id: focal
    generatable: true
    fit: contain
    transparent: true            # a cropped portrait or object cutout
    anchor: [0.5, 0.15]          # upper half, per the research's "face
    scale: 0.50                  # front-and-center" example
text:
  - id: subtitle
    zone: {x: 0.12, y: 0.60, w: 0.76, h: 0.035}
    optional: true
    size_min: 0.016
    size_max: 0.022
  - id: title
    zone: {x: 0.12, y: 0.66, w: 0.76, h: 0.12}
    tracking: 10
    size_min: 0.035
    size_max: 0.075               # moderate, deliberately NOT huge
    max_lines: 2
  - id: author
    # "set nearly as prominently as the title" (research) — an unusually
    # large author size range for this engine's archetypes, on purpose.
    zone: {x: 0.12, y: 0.80, w: 0.76, h: 0.09}
    tracking: 20
    size_min: 0.030
    size_max: 0.055
    max_lines: 2
layers: [background, focal, subtitle, title, author]
