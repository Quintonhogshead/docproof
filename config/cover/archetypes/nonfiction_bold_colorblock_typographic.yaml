# Research: the "Atomic Habits" pattern named explicitly as the model —
# massive sans-serif type + one high-contrast abstract icon; "Wall Street's
# Blind Spots" and "The Happiness Handbook" (Reedsy, 20 Best Book Covers of
# 2025) as concrete 2025 examples; Mel Robbins's "The Let Them Theory" as
# 2025's #1 bestselling nonfiction title. Confidence: high (docs/
# cover_template_research.md #16).
name: nonfiction_bold_colorblock_typographic
genres: [nonfiction]
describe: >-
  Huge stacked title claims most of the cover on one saturated flat color
  block; one small high-contrast icon beneath it, a platform-sized author
  line at the bottom. No scrim — it's a flat color block by design.
composition_note: >-
  At most one small, high-contrast abstract icon or silhouette — a
  sunburst, an arrow, an object relevant to the book's thesis — small and
  centered low in the frame, on one saturated, completely flat, unbroken
  color field covering the rest of the cover. No scene, no illustration.
  No text anywhere.
art:
  - id: background
    generatable: true            # one saturated flat color; procedural
    fit: cover                   # gradient is a fair $0 stand-in
  - id: focal
    generatable: true
    fit: contain
    transparent: true            # one small icon, not a scene
    anchor: [0.5, 0.5]
    # v2.1 BODY-fix wave: scale up (0.18 -> 0.30, "at most one small icon"
    # still holds — the rest of the field stays one flat color) and offset
    # trimmed to match (0.24 -> 0.16) so the now-bigger mark still clears
    # the author line beneath it instead of crowding it.
    scale: 0.30
    offset: [0.0, 0.16]
    # Effects rack (§7.4a): the composition_note already asks for "an icon
    # OR silhouette" — this makes that half of the ask deterministic instead
    # of a coin flip left to the image model, matching Atomic Habits'
    # actual one-flat-shape mark.
    treatment: silhouette
text:
  - id: title
    # v2.1 BODY-fix wave: height 0.46 -> 0.34 — a short title no longer
    # reserves nearly half the cover it will not fill; the freed space goes
    # to the now-larger icon in the lower-middle instead of sitting empty.
    zone: {x: 0.08, y: 0.10, w: 0.84, h: 0.34}
    case: upper
    valign: top
    tracking: 10                 # tight vertical stacking, per research
    size_min: 0.07
    size_max: 0.16                # "up to 70-80% of the cover"
    max_lines: 4
  - id: subtitle
    # v2.1 BODY-fix wave: directly beneath the title zone now (was 0.58, a
    # canyon past title's own bottom edge at 0.44) — no gap between them.
    zone: {x: 0.10, y: 0.46, w: 0.80, h: 0.04}
    optional: true
    size_min: 0.020
    size_max: 0.032
  - id: author
    # "often a personal-brand/platform name" — sized closer to a subtitle
    # than a typical fiction author credit. v2.1 BODY-fix wave: base-
    # anchored (valign: bottom) so it sits flush at the foot of its own
    # zone, clear of the icon now centered in the lower-middle above it.
    zone: {x: 0.10, y: 0.88, w: 0.80, h: 0.06}
    case: upper
    valign: bottom
    tracking: 80
    size_min: 0.022
    size_max: 0.036
layers: [background, focal, title, subtitle, author]
