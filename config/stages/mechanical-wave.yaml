# Stage preset: the mechanical wave — Chicago proofread, recall-first.
#
# This is the portable, known-good Wave 1 recipe (the one that used to live
# only as prose in KNOBS.md). It runs the ensemble recall engine — Luna + Haiku
# union with a Luna verifier over the disputed findings — on top of the base
# config's full error_types and sweeps (a stage is a PATCH on a full base; it
# never restates or drops those lists). The copy-edit lane is held shut and
# LOCKED shut: no genre applied on top of this stage can turn on edits-mode
# smoothing or the rewrite lever. That is the whole point — a mechanical wave
# stays mechanical whatever posture the book carries.
#
# Compose it with a genre:  docproof galley genre-pack religious
#     --stage mechanical-wave --out runs/book/mech.yaml
# The genre still sets posture (name bar, judge stance, query scans); the stage
# guarantees the wave does not silently become a copy-edit.
name: mechanical-wave
description: >
  The Chicago proofread wave: the Luna+Haiku ensemble with a Luna verifier over
  the base config's full typed passes and sweeps, broken-sentence repair on, and
  the copy-edit lane (smoothing edits, rewrite) locked OFF so no genre can
  reopen it. The portable Wave 1 recall recipe.

patch:
  ensemble:
    detectors:
      - {model: gpt-5.6-luna, effort: low}
      - {model: claude-haiku-4-5, effort: low}
    verifier_model: gpt-5.6-luna
    verifier_effort: high
    verify_policy: disputed
  smoothing:
    enabled: false
    edits: false
  rewrite:
    enabled: false
  repair:
    enabled: true
  # The Wave 1 recipe has always been "the ensemble ... repair, BOTH GATES" —
  # but the base config ships the gates off, and until v0.132.0 this stage
  # never turned them on, so a mechanical wave ran ungated while its own
  # documentation said otherwise. Cheap at wave scale; do not drop.
  meaning_check:
    enabled: true
  fix_check:
    enabled: true
  # Storysheet: one Luna read that fixes the narrator/person/tense/pronoun facts
  # AND detects the manuscript's spelling convention (US/UK/CA/AU), which is fed
  # back as `variant` so the spell scan and consistency scans proof against the
  # RIGHT dictionary — a British book is read as British, not "corrected" to
  # American. `variant: auto` (base default under this stage) does the detection;
  # an explicit variant on the config still wins.
  storysheet:
    enabled: true
    model: gpt-5.6-luna
  variant: auto
  # Candidate-screening in APPLY: the low-precision generators propose, the Luna
  # judge (candidate_screening.model, already Luna) rules, and affirmed rows are
  # applied as tracked edits. Apply is a contained capability — it stays SHADOW
  # unless the deployment sets DOCPROOF_CANDIDATE_APPLY=1 (the Galley launch
  # does; production keeps the floor), so this line is a no-op outside Galley.
  candidate_screening:
    mode: apply

locks:
  - smoothing.enabled
  - smoothing.edits
  - rewrite.enabled
