# Stage preset: final replay — rebuild the deliverable, detect NOTHING new.
#
# The last stage. Accepted decisions (from adjudication, from an imported
# judgment packet, from an archived run) are replayed into the tracked-changes
# document through finish(); no new detection may run, because a finding raised
# now would have faced none of the gates the earlier waves applied. So this
# stage zeroes the typed passes (error_types: [] — the one place emptying that
# list is CORRECT and deliberate, not the silent-gutting trap), turns the
# ensemble off, and locks every stylistic/recall lane shut. It is the
# machine-checkable version of "replay only, no surprises."
#
# Sweeps are intentionally LEFT to the base config: the deterministic $0
# normalization sweeps are idempotent and part of producing a clean artifact,
# not a detection lane.
name: final-replay
description: >
  Rebuild the deliverable from already-accepted decisions with no new
  detection: typed passes emptied, the ensemble off, and every stylistic/recall
  lane locked shut. The machine-checkable "replay only" stage.

patch:
  error_types: []
  ensemble:
    detectors: []
    verify_policy: none
  smoothing:
    enabled: false
    edits: false
  rewrite:
    enabled: false
  repair:
    enabled: false
  # "No new detection" means ALL of it, not just the typed passes. The Purpura
  # beta replayed under this stage and the residual number engine re-detected
  # (and re-applied) rows the practitioner had deliberately dropped; glossary
  # would even have made a paid call. Every detector that raises findings —
  # and every paid gate — is off; the deterministic sweeps alone stay with the
  # base config (idempotent normalization, not a detection lane).
  languagetool:
    enabled: false
  spellcheck:
    enabled: false
  consistency:
    enabled: false
  glossary:
    enabled: false
  residuals:
    enabled: false
  meaning_check:
    enabled: false
  fix_check:
    enabled: false
  factcheck:
    enabled: false
  continuity:
    enabled: false
  chapter_continuity:
    enabled: false
  chapter_sweep:
    enabled: false
  sapling:
    enabled: false
  storysheet:
    enabled: false
  candidate_screening:
    mode: 'off'
  low_confidence:
    confirm: false

locks:
  - smoothing.enabled
  - smoothing.edits
  - rewrite.enabled
  - repair.enabled
  - ensemble.verify_policy
  - sapling.enabled
  - chapter_sweep.enabled
