api:
  model: claude-haiku-4-5
  provider: anthropic        # only consulted for models not in the catalog
  max_retries: 2
  max_output_tokens: 16000
  prompt_caching: true
  effort: medium             # low | medium | high | xhigh | max | null
  concurrency: 8             # calls in flight at once on the SYNC path (batch has
                             # no use for it). 1 = strictly serial, and 1 beats
                             # anything in the per-vendor table below
  concurrency_by_provider:   # ...overridden per vendor, chosen by the model the
    openai: 24               # pass is about to call. Only OpenAI's headroom (2M
                             # TPM / 5K RPM) has been measured; Anthropic keeps 8

chunking:
  token_budget: 2500        # soft target per chunk (attention quality, not capacity)
  hard_cap_tokens: 8000     # oversized paragraphs split at sentence boundaries beyond this
  min_paragraph_chars: 0    # 0 = review every non-empty paragraph, dialogue lines included; raise to skip short lines from model passes
  context_token_budget: 300 # read-only trailing context from the previous chunk so antecedents resolve (0 disables); billed per chunk

skip:
  styles:                   # skipped outright — not reviewed, not swept
    - "Title"               # (Word style IDs, fnmatch patterns)
    - "Subtitle"
    - "TOC*"                # a table of contents regenerates from the headings
    - "Caption"
  sweep_only:               # deterministic sweeps run, but no model pass
    - "Heading*"            # a chapter heading: "Chapter Twenty Four" -> "Twenty-Four"

# Manuscript prep: tagging a Word manuscript into a house InDesign style set.
# Both paths are relative to this file. THE STYLE SET IS house_styles.yaml —
# point these at another pair of files to prep for a different template.
prep:
  style_sheet: prep/house_styles.yaml
  tagging_prompt: prep/tagging.yaml
  book_design: prep/book_manuscript.yaml  # book output default: plain manuscript, TNR 12, US Letter (prep/book_design.yaml is the paperback alternate)
  indesign_template: prep/house_template.idml  # the IDML the "indesign" output fills
  watch_book_design: prep/book_manuscript.yaml  # DocWatch's reading copy, kept plain independently of book_design
  max_paragraphs_per_window: 120   # one request per window
  token_budget: 6000               # ...whichever limit comes first
  context_paragraphs: 8            # already-labelled paragraphs sent for continuity
  preview_chars: 400               # how much of a long paragraph the model sees
  outputs: [book]                  # book | indesign | tracked — the app overrides this
  strip_direct_formatting: true    # in the placed file only; italics always kept
  verify: true                     # refuse to ship a file whose words drifted

# Promo: a teaser and a set of social posts from a finished manuscript, written
# in one pass over the whole book. The prompt is a file — point generation_prompt
# elsewhere, or edit config/promo/generation.yaml, to change the voice or drop in
# the house copy specs. The model is NOT set here: promo reads api.model, so the
# app picks it per run and any vendor works. See docs/promo.md.
promo:
  generation_prompt: promo/generation.yaml
  plan_prompt: promo/marketing_plan.yaml   # the marketing plan — promo's 3rd deliverable, its own call
  post_count: 12                   # how many social posts to ask for
  max_input_tokens: 180000         # refuse a book too big for one pass, don't overflow
  outputs: [teaser, posts]         # teaser | posts — the app may override this
  verify: true                     # flag capitalised terms absent from the book (never blocks)
  verify_claims: false             # opt-in: a 2nd call checks each claim against the book (costs a re-read)
  verify_prompt: promo/verify.yaml

# The two edits made silently, outside the tracked-changes system, because
# neither is a content change an author needs to review. Applied before ingest,
# so every later stage measures against normalized text. Counted in the report
# but never logged line by line. Quote curling converts only what it can
# determine from the text and leaves the rest straight — a mark curled the
# wrong way ships, because there is no tracked change to reject.
normalize:
  quotes: true
  spaces: true    # collapse runs to one; strip paragraph-trailing spaces whole

# Two quoted speeches sharing one paragraph with nothing but whitespace between
# them ("…won't go.” “You will…") are split so each speaker begins a new line —
# a tracked change on the paragraph mark (rejecting merges the paragraphs back)
# plus a declarative margin comment stating the change, per the head
# proofreader's ruling on the Johnson run. Judgment cases (a second speaker
# behind narration) stay with the speaker_change query. Whole-document runs
# only; the cap stops the pass on a manuscript set in a convention it does not
# understand (interviews, plays).
speaker_split:
  enabled: true
  max_splits: 300

# A dictionary scan that never corrects anything. It sorts every unknown word:
# words written as NAMES become a do-not-flag list sent to every pass (what
# stops a coined name being "corrected" into the word it resembles); words that
# come apart into an ordinary word plus an ending English does not give it
# (growed → grow, layed → lay) and words used only seldom are handed to the
# model to look at; words merely repeated are passed on as evidence, not
# protection — because a misspelling the author believes in repeats just as
# faithfully as a coinage. Needs the optional `spylls` package; without it the
# scan is skipped and the passes run as before.
spellcheck:
  enabled: true
  # Unset means "whatever `variant` asks for", which is almost always right.
  # spylls bundles en_US only, so a uk/ca/au run has no dictionary unless you
  # point this at an .aff/.dic pair of your own (a path, without the
  # extension). Checking British spelling against a U.S. word list would file
  # every correct "colour" as unknown, so the scan declines instead.
  dictionary:
  min_occurrences: 2        # seen this often → "used throughout" (evidence for the
                            # model), not protection; seen less → raised to look at
  suggestion_limit: 25      # candidates given dictionary guesses (~0.25s each)
  allowlist: []             # always correct for this house, whatever the dictionary says
  # Spellings the house never accepts → their correction. Never protected by
  # repetition; the fix is given directly (the right form is often two words an
  # edit-distance search cannot reach). Set to {} to disable.
  denylist:
    alot: a lot
    aswell: as well
    infact: in fact
    eachother: each other
    atleast: at least
    incase: in case
    everytime: every time
    abit: a bit
    inspite: in spite
    ofcourse: of course
  # Hygiene on the protected list itself: two protected names one edit apart
  # (Hollingworth beside Hollingsworth) are more often one misspelled
  # character than two characters named alike. When one owns the book
  # dominance-to-one, the rarer is demoted to the adjudication pass; close
  # counts become a query for the author; a rarer plural cased unlike its
  # singular (Evtols beside EVTOL) is demoted whatever the ratio.
  near_duplicates: true
  near_duplicate_dominance: 5

# One term written more than one way — blood-cursed against bloodcursed, safe
# keeping against safekeeping. The rule per-paragraph review structurally
# cannot do: a model reading chapter 4 has no idea what chapter 40 said. For
# terms it asks and never corrects, because the same test that finds an
# inconsistency cannot tell one from a distinction (awhile and a while differ
# in meaning), and which form a book uses is the author's to settle.
# Proper names get one bounded exception: a capitalized word that never
# appears lowercased and differs from another only in its diacritics — Rian
# against Rían — is one name, not two meanings. When one spelling clearly owns
# the book (name_dominance times as many, name_min_count seen, never in one
# sentence with a stray), the strays are corrected as tracked changes the
# author can still reject; below that bar they are asked about like any term.
# Whole-document runs only. Free: no API call.
consistency:
  enabled: true
  min_length: 7             # shorter keys collide by accident
  min_dominance: 2          # how far the majority must lead; 1 flags even splits
  names: true               # proper-name diacritic scan (Rian -> Rían)
  name_dominance: 5         # majority lead before a stray is corrected, not asked
  name_min_count: 20        # how established the dominant spelling must be
  # The three mechanical scans a compound-word scan cannot do — all query-only,
  # whole-document, deterministic. See docproof/consistency.py.
  spelling_variants: true   # grey/gray, toward/towards (VarCon + Chicago table)
  abbreviations: true       # U.S./US, a.m./AM
  acronym_case: true        # NASA/Nasa (needs the spell dictionary)
  # "us" also queries words the book spells the British way THROUGHOUT
  # (theatre, colour), one query per word proposing the American form —
  # regular British/American families only, so towards/grey never flag.
  # Off by default: enforcing U.S. spellings on a consistently-British
  # manuscript is a house policy call. Flip to "us" when it is.
  variant_policy: "off"
  # Lowercase he/his/him inside a deity-anchored sentence, in a book that
  # plainly capitalizes pronouns referring to God. Self-gating on the book's
  # own convention; query-only, since pronoun reference is the author's call.
  deity_pronouns: true
  deity_min_capitalized: 8
  # Bare clock hours ("around 4", "at 8") in a book whose own style writes
  # times with minutes ("11:00 AM"). Query-only, self-gating on the book
  # carrying time_min_with_minutes H:MM times — the whole-book inconsistency
  # the Purpura head-proofreader pass fixed by hand.
  time_style: true
  time_min_with_minutes: 3
  # Loanwords written without the dictionary's accent (Si/Sí, senor/señor),
  # from a short curated table of words whose bare spelling is not accepted
  # English on its own. One query per word, at its first bare occurrence.
  accent_loanwords: true
  chicago_notes: true       # add the Merriam-Webster preference to the query
  max_queries_per_kind: 40  # per-scan cap, logged when it bites (no silent loss)
  seeded_names: []          # proper nouns known ahead of the run (typically from
                            # `docproof galley profile`); protects them in the
                            # mechanical scans above even below the spell scan's
                            # own protection bar. See docproof/genre.py.

# A strong model reads the whole manuscript once, before the detector passes,
# and returns the book's proper nouns (canonical casing) + suspected
# misspellings — including valid-word-for-valid-word errors (calvary/cavalry)
# that a dictionary and a frequency signal both miss. Suspects become
# adjudication candidates (ruled on in context); casing feeds a query-channel
# drift check. One cacheable read; priced for its own (frontier) model.
glossary:
  enabled: true
  model: gpt-5.6-luna       # any catalog id; the app panel offers a picker.
                            # Luna is cheap (~$0.04/book) and catches the obvious
                            # real-word errors; a frontier model (Opus) adds the
                            # subtle semantic tail at ~40x the cost — pick per book.
  effort: medium
  # One whole-book read, so a truncation loses the WHOLE glossary (the run
  # then proceeds without one). The ceiling covers the model's thinking too.
  max_output_tokens: 16000
  cache_dir:                # a path pins the read per draft (keyed by text+model+
                            # effort+prompt): re-runs of an unchanged draft skip
                            # the cost and see the SAME glossary, so case-drift
                            # stops wobbling run to run.
                            # BLANK IS NOT OFF — blank means the shared default
                            # folder (DOCPROOF_CACHE_DIR, else under DOCPROOF_HOME).
                            # To turn caching off and re-read every time, set the
                            # DOCPROOF_CACHE_DIR environment variable to empty.
  case_drift: true          # raise proper-noun casing drift as margin queries
  case_drift_scan: true     # discover strays across the whole book (not just the
                            # variants the model self-reports); leading article
                            # normalised out so "the Upper City" is never flagged
  case_edit_dominance: 5    # a multi-word name leading its strays this many to
                            # one (and seen case_edit_min_count+ times) corrects
                            # the stray as a tracked change; otherwise it asks
  case_edit_min_count: 8

# One whole-book read for REAL-WORLD factual slips — institutional names and
# acronym expansions (the NTSB is Transportation, not Traffic), historical
# figures and events, geography, currencies. The class the human second
# reviewer catches in passing and a per-chunk grammar pass structurally
# cannot. Every catch is a margin QUERY, never an edit: fiction bends the
# world on purpose, so a fact is the author's to settle. Cached per draft and
# priced for its own model, like the glossary. Off by default: a whole extra
# read, opt-in until proven — flip it here or per run in the app panel.
# The table of contents checked against the body's own structure: contents
# wording vs the chapter/part page ("massive" in the contents, "drastic" on
# the part page), chapter and part numbering, entries listed but absent or
# present but unlisted. One SMALL model read over a deterministic structure
# extract (the opening pages + a heading outline) — a few thousand tokens even
# on a long novel, so it ships ON, unlike the fact check's whole-book read.
# Every catch is a margin QUERY, never an edit: which copy is right is the
# author's to settle. Cached per draft. See docproof/toccheck.py.
toccheck:
  enabled: true
  model: gpt-5.6-luna
  effort: medium
  max_output_tokens: 8000   # covers the model's thinking; a truncated
                            # structured reply parses as NOTHING (silent loss)
  max_queries: 20
  cache_dir:                # blank = the shared whole-book cache

factcheck:
  enabled: false
  model: gpt-5.6-luna
  effort: medium
  max_output_tokens: 16000
  max_queries: 40           # the margin is an author's attention; overflow is
                            # logged, not placed
  cache_dir:                # blank = the shared default folder, as above

# Three opt-in, deterministic (or wordfreq-only) whole-document QUERY-ONLY
# scans a genre pack may turn on. No API call for any of them. Every finding
# force_query's — never a tracked change, by construction. Off by default.
# See docproof/genrescans.py and docproof/genre.py.
genre_scans:
  anachronism:
    enabled: false
    era:                    # the manuscript's own stated year AD; blank = no-op
                            # even when enabled (never guessed)
    max_queries: 40
  citation_format:
    enabled: false
    min_occurrences: 2      # a style needs this many hits to count as "in use"
    max_queries: 40
  reading_level:
    enabled: false
    target_ari:             # blank = centered on the book's own median paragraph
    tolerance: 6.0
    min_words: 40            # a paragraph shorter than this has no real signal
    max_queries: 40

# The copy-edit flights lane (docproof/flights.py; `docproof galley flights`).
# posture is the judge's default stance — the measured 24%<->57% accepted-recall
# dial. Genre posture presets (config/genres/*.yaml) set it per manuscript;
# the --posture flag overrides it per run.
flights:
  posture: strict            # strict | lenient

# The whole-book story sheet: one read that gives the detector passes the
# narrative facts a per-paragraph check cannot know — who narrates, in what
# person and tense, and each character's pronouns — injected into every
# detector's system prompt (cached per document, like the vocabulary). It lets a
# paragraph-in-isolation pass catch a pronoun, name, or tense that is wrong for
# the STORY (his/her, I/you, a tense slip), the wrong-word errors it otherwise
# glides over. Off by default: a whole extra read, opt-in until proven.
# Whole-document only. See docproof/storysheet.py.
storysheet:
  enabled: false
  model: gpt-5.6-luna
  effort: medium
  max_output_tokens: 12000  # one whole-book read; truncating loses all of it
  cache_dir:                # a path pins the read per draft (text+model+prompt);
                            # blank = the shared default folder, as above

# Whole-book continuity read: one frontier read of the entire manuscript that
# flags facts the book contradicts about itself — timeline slips, age/date
# arithmetic, attribute drift, object continuity. Query-only by design: every
# finding is a margin comment, never a tracked change (which fact is right is the
# author's call). A deterministic date->weekday checker rides along at no API
# cost. OFF by default until proven on a real-manuscript compare, like rewrite.
# Whole-document only. See docproof/continuity.py.
continuity:
  enabled: false
  model: gpt-5.6-luna       # the house default, so no key beyond the reviewer's is
                            # needed; the app panel picks a frontier reader per book
                            # (claude-opus-5 / claude-sonnet-5) when one is keyed
  effort: high
  # A frontier model at effort high, reading a whole book and writing up to
  # max_queries findings with an explanation each — and it always thinks, so
  # most of this ceiling is reasoning. Sized with headroom: a cap costs
  # nothing until tokens are actually generated, while a truncated read is a
  # fully billed call whose findings are ALL lost (a cut-off structured reply
  # parses as nothing). One truncation is retried once at double this ceiling
  # — reasoning spend varies run to run, and this one call has no window to
  # split the way the chunked passes recover.
  max_output_tokens: 32000
  max_queries: 40           # cap on margin comments; most significant first
  min_confidence: medium    # drop "low" — a wrong continuity flag costs trust
  calendar_check: true      # deterministic date->weekday math; no API, query-only
  max_input_tokens: 400000  # refuse a book too big for one read — never truncate
  cache_dir:                # a path pins the read per draft (text+model+prompt);
                            # blank = the shared default folder, as above

# Chapter-scoped continuity read: the third reading distance. The chunk detectors
# read a paragraph at a time and the continuity read above reads the whole book at
# once; this reads one CHAPTER at a time, for the break that closes inside a chapter
# and is invisible to both — a character who sits down who never stood, someone who
# leaves a room then speaks in it, a cigarette lit twice, dawn that becomes evening
# in one scene, a reply to a question no one asked. Built on the taste judge's shape:
# read each chapter, drop any break whose two quotes don't both land in it, let a
# skeptical judge cull the rest, cap the volume per chapter. Query-only by design;
# dialogue IS in scope (a contradiction spoken aloud is still one). OFF by default,
# whole-document only. See docproof/continuity.py.
chapter_continuity:
  enabled: false
  model:                    # the chapter reader; blank = the continuity model, then api.model
  effort: high
  max_output_tokens: 8000   # per chapter; a reasoning model spends most of this thinking
  judge_model: gpt-5.6-luna     # the skeptical precision gate; house default, one
                                # model pick in the panel overrides both reader and judge
  judge_effort: high
  judge_max_output_tokens: 16000  # a truncated judge batch returns no verdicts at all
  batch_size: 40            # candidates per judge request
  sensitivity: 2            # "how hard it looks", 1-5: bundles judge posture + floor.
                            # 1 Cautious · 2 Measured (default) · 3 Thorough ·
                            # 4 Searching · 5 Exhaustive. See continuity.py.
  max_per_chapter: 10       # the volume cap — the chapter is this pass's natural unit
  min_chapter_tokens: 1000  # a smaller unit (an epigraph) merges into a neighbour
  max_chapter_tokens: 120000  # a bigger unit is size-split; a headingless book too
  cache_dir:                # a path pins each chapter's read per draft (text+model+prompt)
  prompt: ""                # the chapter reader's system prompt; blank = built-in
  judge_prompt: ""          # the judge's system prompt; blank = built-in

# Multi-round review: review the manuscript `count` times, each round reading the
# previous round's corrected text, with a strong judge ruling on every correction
# between rounds. All approved changes are composed into one tracked-change file
# against the original. count 1 = a single ordinary review (default, inert).
rounds:
  count: 1
  judge_model: gpt-5.6-sol # the between-round judge; picked per job in the panel
  judge_effort: high
  judge_prompt: ""         # empty = built-in default (editable in the review panel)
  min_new_edits: 1         # stop early once a round approves fewer than this
  reuse_whole_book_reads: true

# Real-word typos the plain passes glide over (staired, a protected repeated
# misspelling), found by local signals and ruled on by the model in context.
# Only a high-confidence affirmed fix becomes a tracked change; softer calls are
# margin queries — so a wrong candidate costs at most a question. Whole-doc only.
adjudicate:
  enabled: true
  near_miss_gap: 2.5         # zipf lead a common word needs to un-protect a coinage
  min_word_len: 4           # short tokens are too edit-close to judge cheaply
  max_candidates: 500       # bound on sites sent to the model, logged when it bites
  batch_size: 40            # candidates per adjudication request
  edit_confidence: high     # at/above this an affirmed fix edits; softer -> query

# Rewrite-then-diff: the model retypes each paragraph minimal-edit, the diff
# against the source becomes candidates, and a skeptical confirm pass rules on
# each in context (high -> tracked edit, softer -> margin query, keep -> nothing).
# Reshapes detection into generation to surface the missing-word / letter-typo /
# agreement misses the detector glides over. OFF by default: a strong recall
# lever but a whole extra (output-heavy) pass in cost, shipping opt-in until
# proven on a real-manuscript compare. Whole-document only. The retype calls
# RIDE THE BATCH when `model` matches api.model (the default) — half price, and
# clear of the sync rate-limit wall; only the light confirm runs at collect.
# A different `model` cannot share the one-model batch, so it falls back to
# synchronous retyping at collect. See docproof/rewrite.py.
rewrite:
  enabled: false
  model:                    # unset = api.model (the detector's); a cheap one is plenty.
                            # Set it to a DIFFERENT model and the retype runs sync
                            # (can't share the review's batch), losing the discount.
  effort: medium
  max_output_tokens: 16000  # covers the retype AND the confirm valve; see
                            # languagetool.max_output_tokens for the measurement
  max_span: 48              # a diff whose delete or insert exceeds this is a paraphrase
  max_added: 24             # ...or that adds more than this many net chars — dropped
  samples: 1                # independent retypes per chunk, unioned. >1 lifts recall
                            # (a stochastic retype misses different errors each pass);
                            # each extra sample is another whole retype in cost
  diverse: true             # point each sample at a different error class (small
                            # omissions, agreement, ...) instead of asking twice;
                            # covers more at the same cost. No effect at samples=1
  workers: 8               # concurrency for the SYNC path only (run_sync, or the
                            # different-model fallback); the batch handles its own
  batch_size: 40            # candidates per confirm request
  edit_confidence: high     # at/above this an affirmed fix edits; softer -> query
  confirm_model:            # unset = the rewrite model confirms its own diffs. A
                            # stronger id here (any vendor) gates recall better for
                            # little cost — confirm prompts are short. Runs sync.
  confirm_effort: medium
  log_rejects: false        # write confirm's kept-as-not-an-error candidates to
                            # rewrite_rejects.json (diagnostic; batch collect only)

# LanguageTool mechanical-floor pass: a LOCAL rules-based checker (no network, no
# per-call cost, no client text egress) that proposes commas / missing words /
# compound-modifier hyphenation the model glides past, then routes each through
# the SAME confirm valve as rewrite (high=edit, soft=query, keep=nothing) — so it
# never edits blind. Orthogonal to the LLM (~5% catch overlap); ~+6pt tracked-edit
# recall on the mechanical tail at ~$0.01/book (confirm only). Needs Java + the
# LanguageTool jar (auto-downloaded, cached), so OFF by default. Whole-document
# only. See docproof/languagetool.py.
languagetool:
  # enabled is driven by the app tier (Standard and up turn it on); the base
  # config leaves it off so a raw-config or checkpoint path does not silently
  # boot the ~850MB JVM. When it DOES run, it runs at the picky level below.
  enabled: false
  picky: true               # LanguageTool's strict level: its extra higher-FP
                            # rules run too (more comma/hyphen/style catches +
                            # more noise). The denylist and rewrite.confirm valve
                            # still filter every match, so the extra noise costs
                            # confirm-valve LLM calls, not blind edits. N-grams
                            # are NOT enabled (they need multi-GB data files).
  dictionary: en-US         # LanguageTool language code (en-US | en-GB | …)
  disabled_rules: []        # extra rule ids to drop, atop the built-in
                            # artifact/style denylist (unpaired-quote, caps-start,
                            # whitespace, style advice)
  workers: 0               # scan threads; 0 = auto (one per usable core). The
                            # pass caps this at the CPU count, so on a single-core
                            # VM the scan stays serial. Raise nothing to speed it
                            # up — give the machine more cores instead.
  scan_chars: 20000         # characters per request to the local server. The
                            # paragraphs in a request are blank-line separated,
                            # which LanguageTool reads as a paragraph break, so
                            # each is still checked on its own; this only stops
                            # the per-request cost being paid once per paragraph.
                            # Measured on 28k words, one thread: 6.96s at one
                            # paragraph per request vs 3.27s here, identical
                            # candidates. 0 = one request per paragraph
  # Ceiling per confirm request. The verdicts are terse, but the ceiling has to
  # cover the model's THINKING as well as what it writes back, and on a
  # reasoning model the thinking is most of it. Measured on a real manuscript at
  # batch_size 40: ~4,400 tokens at effort medium and ~8,100 at high, varying
  # run to run — so the old 4,000 truncated on ordinary input, and a truncated
  # structured response carries no verdicts at all. Sized well clear of the
  # measurement because an unused ceiling is free: you are billed for the tokens
  # generated, never for the cap. Truncation is also now recovered from and
  # counted rather than silently dropping the window (docproof/windowing.py).
  max_output_tokens: 16000
  batch_size: 40            # candidates per confirm request
  edit_confidence: high     # at/above this an affirmed fix edits; softer = query
  confirm_model:            # unset = api.model confirms; a cheap model is plenty
  confirm_effort: medium

# Sapling.ai grammar/spell pass — a hosted checker whose suggestions fold into
# the tracked changes after the sweeps and the model. Off by default and opt-in
# per run; needs SAPLING_API_KEY in the environment. See docproof/sapling.py.
sapling:
  enabled: false
  variety: ""               # "" | us-variety | gb-variety | au-variety | ca-variety
  comments: true            # false = apply Sapling edits silently, no margin comment
  cost_per_1k_chars: 0.025  # $ per 1,000 chars — for the pre-run estimate only

# Frontier chapter sweep: a strong model reads chapter-sized windows under ONE
# loose instruction — find spelling and grammar errors — and proposes verbatim
# quote->correction pairs. No error-type taxonomy (no taxonomy blind spots),
# chapter-scale context (cross-sentence slips visible). Proposals are anchored
# fail-closed and ruled on by the SHARED rewrite.confirm valve, so only an
# affirmed error becomes a tracked change and a softer affirmation asks in the
# margin. Complementary to the typed passes by measurement (Redding pilot,
# 2026-08-23): it catches the judgment-call band they miss; they keep the
# mechanical floor it skips. OFF by default — a frontier-priced read of the
# whole book. Whole-document only. See docproof/chaptersweep.py.
chapter_sweep:
  enabled: false
  model: claude-fable-5     # needs ANTHROPIC_API_KEY (skipped, with a coverage
                            # note, when the vendor key is missing)
  effort: xhigh
  window_chars: 48000       # ~a long chapter per request
  max_output_tokens: 64000  # the sweep reply (findings list + thinking). 32k
                            # truncated 2 of 6 windows on Redding (2026-08-23);
                            # clean windows stop at 3k–25k, so the headroom
                            # costs nothing unless it saves a window.
  batch_size: 40            # candidates per confirm request
  edit_confidence: high     # bar an affirmed edit clears; softer = margin query
  confirm_model:            # unset = api.model (the detector's)
  confirm_effort: medium

# Repair channel: route error-dense sentences to a strong model, fix each as one
# ATOMIC cluster. Where every other correcting pass emits an atomic token edit,
# this one repairs a broken sentence whole — and it is TRIGGERED by the other
# passes: a sentence in which the detectors flag at least `error_threshold`
# separate corrections is probably broken as a whole, so it is routed to a strong
# model (Fable) for one minimal repair. The diff becomes a cluster of co-dependent
# member edits sharing a cluster_id; a skeptical judge rules on the WHOLE cluster
# (broken, minimally fixed, meaning-preserved), an affirmation at edit_confidence
# writes, a softer one asks. The members sit early in arbitration so the coherent
# repair supersedes the scattered token edits that triggered it, and they ship as
# separate tracked changes but stand or fall together — if any member does not
# survive, the whole cluster is withdrawn, so a repair is never shipped by halves.
# The judge's meaning ruling, not a character count, is the fabrication defence,
# so repair edits are exempt from the edit guard; a deterministic size cap still
# drops a "repair" that rewrote more than it fixed. OFF by default and the
# highest-risk pass — meant to be measured in shadow mode before it is trusted to
# write. Whole-document only. See docproof/repair.py and docs/repair.md.
repair:
  enabled: false
  error_threshold: 3        # THE TRIGGER: a sentence with this many separate
                            # flagged corrections is routed to the repair model
                            # (the judge still declines any that is only stylistic)
  model: claude-fable-5     # the repair read; needs ANTHROPIC_API_KEY (skipped,
                            # with a coverage note, if the key is unset)
  effort: high
  max_output_tokens: 16000  # the repair reply (repaired sentences + thinking);
                            # a truncated window is halved and re-asked
  confirm_model:            # the judge; unset = api.model (the detector's)
  confirm_effort: high
  batch_size: 20            # triggered sentences per request
  edit_confidence: high     # bar a repair clears to WRITE; softer = margin query
  max_added_chars: 120      # a "repair" adding more net text than this is a
                            # rewrite, dropped before the judge (the deterministic
                            # half of the fabrication defence)
  max_members: 12           # ...or touching more spans than this
  repair_prompt: ""         # empty = built-in contract (see docproof/repair.py)
  judge_prompt: ""          # empty = built-in judge (see docproof/repair.py)

# Line-editing pass: the half of a proofreader's job the other passes refuse. A
# reader proposes small smoothings — a word doing no work, an unidiomatic
# preposition, an awkward coordination, a rough tense, an ambiguous pronoun —
# and a skeptical taste judge culls them. Query-only by DEFAULT: every finding
# is a margin comment, because a smoothing has no right answer, only a better
# one, and which is better is the author's call. The `edits` switch is the
# explicit exception — judge-affirmed-at-HIGH smoothings apply as tracked
# changes the author accepts/rejects in Word, and softer ones still ask. Dialogue is excluded by default and author coinages are filtered out
# before the judge sees them — voice risk is what these knobs defend. Volume is
# capped per 1,000 words; anything dropped by the cap is COUNTED in summary.md.
# Echo is deliberately not a category here: `word_echo` owns it in the taxonomy.
# OFF by default — a whole extra read plus a judge, and the one pass whose
# output is taste rather than correctness. Whole-document only.
# See docproof/smoothing.py.
smoothing:
  enabled: false
  edits: false              # true = judge-affirmed-at-HIGH smoothings apply as
                            # tracked changes (softer ones still ask); false =
                            # every smoothing is a margin comment
  model:                    # unset = api.model (the detector's)
  effort: medium
  judge_model: gpt-5.6-luna  # taste is the hard part, but the house default keeps this
                            # on the reviewer's key; a frontier judge is a per-run pick
  judge_effort: high
  include_dialogue: false   # true smooths inside quoted speech — voice risk lives here
  max_per_1000_words: 3.0   # volume cap; overflow is dropped AND counted in summary.md
  min_confidence: medium    # drop anything the judge affirms softer than this
  batch_size: 40            # candidates per judge request
  max_output_tokens: 16000  # the proposing read — sized like the judge below:
                            # on a reasoning model the ceiling covers the
                            # THINKING too, so 4,000 truncated a dense window and
                            # dropped it whole, which reads as restraint. Unused
                            # ceiling is free; propose() counts any read that
                            # still fails so it is reported, not mistaken for
                            # silence.
  judge_max_output_tokens: 16000  # much larger on purpose: a verdict is tiny,
                            # but on a reasoning model the THINKING counts here
                            # too, and a truncated judge batch returns no
                            # verdicts at all — every candidate in it vanishes
                            # and the run looks restrained instead of broken
  propose_prompt: ""        # empty = built-in default (see docproof/smoothing.py)
  judge_prompt: ""          # empty = built-in default

# Fallback $/MTok rates for the cost estimate, used only when api.model is not
# in docproof/providers/catalog.py (which carries per-model rates). Leave unset
# to omit the estimate for unknown models.
pricing:
  input_per_mtok: null
  output_per_mtok: null

# Which English this manuscript is written in: us | uk | ca | au. It flips the
# conventions that differ by variant — which mark opens dialogue, decade
# apostrophes, percent vs per cent, date and time formats, the that/which rule
# — and picks the spell-scan dictionary. Stated, never inferred: guessing and
# then applying the guess silently is how a U.K. book comes back Americanized.
# Canadian and Australian are hybrids, so their change logs ask the press to
# confirm. See config/variants/ and docs/variants.md.
variant: us

min_confidence: medium      # low | medium | high — gate for applying changes

# What happens to a model edit that falls BELOW min_confidence. Left off, the
# gate's original behaviour holds: a below-gate edit never auto-applies and (with
# query_comments on) shows only as a margin comment. The type prompts mark
# anything in dialogue "low" on purpose, which also strands real dialogue
# mechanics there. With confirm on, each below-gate edit is re-ruled by an LLM in
# context through the SHARED rewrite.confirm valve — affirmed at edit_confidence
# it becomes a tracked change, a softer affirmation a margin query, a "not an
# error" verdict is dropped. Recovers the genuine catch without lowering the gate
# for everything. A paid pass; off until measured on the recall harness, like
# rewrite/languagetool/sapling. See docproof/pipeline._promote_low_confidence.
low_confidence:
  confirm: false
  edit_confidence: high     # the bar an affirmed below-gate edit clears to apply
  batch_size: 40            # candidates per confirm request
  max_output_tokens: 16000  # the shared confirm valve; see languagetool
  # Unset = the detector's own model confirms. A stronger model here is cheap
  # (the prompts are short) and is the point of a separate confirm valve.
  confirm_model:
  confirm_effort: medium

# The judge gates — the last reads before the manuscript is written. Every check
# above asks whether something is an error and whether the fix is right, while
# the change is still being proposed. These run at the other end, over the
# changes that survived everything else, source-blind: a Sapling suggestion, a
# LanguageTool comma, a rewrite diff and a detector finding all arrive here as
# the same kind of object.
#
# They ask two different questions, and are separately switchable because they
# fail differently. A change can be a faithful fix that alters the sense, and it
# can preserve the sense perfectly while being the wrong repair.
#
# Both are purely SUBTRACTIVE: a change a judge will not vouch for is held back
# as a margin question with its reason attached, never dropped and never silently
# applied, and an unanswerable call leaves the change untouched. Cost tracks the
# number of CHANGES, not the length of the book (a few hundred short calls per
# gate, one per paragraph that has edits), which is what makes a frontier model
# affordable here and nowhere else. Off by default, like every paid pass.
# See docproof/judges.py.

# Does the corrected sentence still MEAN what the original meant?
meaning_check:
  enabled: false
  model: gpt-5.6-luna       # the last reader before the author; house default keeps it
                            # on the reviewer's key, and the app panel picks it per run
  effort: high
  scope: model_sources      # model_sources (detector, rewrite, adjudicate,
                            # low-confidence, LanguageTool, Sapling) | all, which
                            # adds the scripted sweeps and the consistency scan —
                            # punctuation-sized changes these gates can't fault
  flag_unsure: true         # an "unsure" verdict is held back too; off applies it
  # A frontier model at effort high that always thinks, so this ceiling is
  # mostly reasoning. The gates batch per PARAGRAPH (a few changes per call),
  # which is what kept 4,000 workable — but a heavily corrected paragraph is
  # not rare, and a truncated gate applies every change in it unread: 12k did
  # exactly that on a 7-change paragraph (2026-08-23). A clean reply stops far
  # short, so the raise only spends on calls that would otherwise truncate.
  max_output_tokens: 24000
  prompt: ""                # empty = built-in default (editable in the review panel)

# Is the replacement the CORRECT fix? Same wiring, same knobs, different
# question — "their" corrected to "there" where "they're" was wanted, a verb in
# the wrong form for its subject, a semicolon the clauses will not carry.
fix_check:
  enabled: false
  model: gpt-5.6-luna       # house default; a frontier fix judge is a per-run pick
  effort: high
  scope: model_sources
  flag_unsure: true
  max_output_tokens: 24000   # as meaning_check above
  prompt: ""

# Each entry is ONE API pass over the whole document. A bare key runs alone;
# a list runs as a single combined pass, so the document is sent once for the
# whole group instead of once per type. Related types are grouped together —
# defining comma_splice and run_on_sentence side by side sharpens the boundary
# between them. Precision order matters: the validator keeps the first edit to
# claim a span, so the most objective types run first.
#
# An entry may also be a mapping, to tune ONE category without touching the
# global chunking budget or re-reading the whole book:
#   - group: [serial_comma, introductory_comma, direct_address_comma]
#     passes: 2            # run this category's read this many times (default 1);
#                          #   repeats catch stragglers the first pass missed and
#                          #   the validator keeps one edit per span, so overlap
#                          #   is deduped, not doubled.
#     token_budget: 1800   # chunk size for THIS category only (default: the
#                          #   global chunking.token_budget). Smaller = fewer
#                          #   paragraphs per call = tighter attention = better
#                          #   recall on hard categories, at higher cost.
# Both keys are optional; omit the mapping form entirely and a plain key or list
# behaves exactly as before.
error_types:
  # mechanical — objective, verifiable, low false-positive rate
  - [repeated_word, spelling, homophone_confusion, apostrophe_error, capitalization]
  # house commas — one Atmosphere house-guide rule each. The introductory /
  # scene-setting comma is the largest single recall gap in the miss set; the
  # primary lever for it is introductory_comma's own loosened prompt (short
  # time-and-place openers and sentence adverbs the guards used to suppress).
  # For an extra recall push on a hard manuscript, dial this category to
  # {passes: 2, token_budget: 1800} on the review panel — a second read over
  # tighter chunks, deduped one-edit-per-span by the validator. It is a per-run
  # knob rather than a shipped default on purpose: a shipped passes>1 would
  # roughly double this pass's cost on every run, and the drop-time estimate
  # prices per-category tuning as a panel delta, not in the flat base.
  - [serial_comma, complex_list_semicolon, introductory_comma,
     direct_address_comma, tag_question_comma]
  # dialogue mechanics — the highest-volume error class in fiction, and the
  # one with the most detailed rule table. speaker_change rides along because
  # it reads the same paragraphs for the same reason, and asks rather than
  # corrects.
  - [dialogue_tag, speaker_change]
  # numbers & money — a dedicated pass. Numbers are the house's most
  # persistent sticking point (field QA keeps surfacing missed spell-outs,
  # ordinals, and stage labels), so the two number categories read alone:
  # nothing else shares the model's attention on a number-bearing chunk.
  # For an extra recall push on a number-heavy manuscript, dial this category
  # to {passes: 2, token_budget: 1800} on the review panel — the same
  # per-run trade as the comma note above, and priced the same way (a panel
  # delta, not the flat base).
  - [number_style, currency_style]
  # house mechanics — hyphenation and the one rule that changes how text is
  # set rather than what it says
  - [ly_adverb_hyphen, title_italics]
  # sentence grammar — needs parsing, still decidable. compound_sentence_comma
  # rides beside comma_splice so the model reads the two clause-comma rules
  # together: a coordinating conjunction joining two independent clauses wants a
  # comma ADDED before it (compound_sentence_comma), while two clauses joined by
  # a comma with NO conjunction wants that comma REPLACED (comma_splice). Seeing
  # the boundary defined keeps it from firing the wrong one — or one for the
  # other. The type's own guards decline the common false positive, a compound
  # predicate (one subject, two verbs). that_who rides beside that_which so the
  # two relative-pronoun rules are read together: that_which owns "that" vs.
  # "which" for things, that_who owns that/which -> "who" for people, and each
  # cedes the other's case, so a site is reported once.
  - [comma_splice, run_on_sentence, compound_sentence_comma,
     subject_verb_agreement, that_which, that_who]
  # judgment calls — style-sensitive, most likely to fire on deliberate prose
  - [tense_shift, pronoun_agreement, missing_word, preposition_error]
  # usage fixes and run-in list punctuation — cheap, rule-friendly swaps no
  # other pass owned: colloquial "try and <verb>" -> "try to <verb>", and a
  # colon before a numbered run-in list that a complete clause introduces.
  - [try_and, list_intro_colon]
  # terminal-mark queries — precision-unproven, activated for live measurement.
  # Its own pass so the judgment stays isolated and easy to toggle off. Query
  # channel: asks whether a period should be a question mark, never edits.
  - terminal_mark
  # the one comma rule that DELETES rather than adds: an unpaired comma the
  # sentence cannot defend (subject|verb, verb|object, correlative halves, or a
  # defining clause). Every other comma type here ADDS the commas house style
  # wants, so this is the only counterweight — kept in its own pass because a
  # deletion is higher-risk than an insertion and, like terminal_mark, its LLM
  # precision is unproven; isolate it so it stays easy to toggle and measure.
  - unnecessary_comma
# House-style conventions the sweeps enforce where the right answer is the
# press's choice, not a rule. Not in config/variants/ because none of it flips
# on US/UK — a house sets it once for every manuscript.
#   ellipsis: how an ellipsis sits against its neighbours.
#     nbsp   — a non-breaking space before it, a plain space after. The
#              Atmosphere house convention (Bad[NBSP]… she trailed off).
#     closed — no space before it, a plain space after when a word follows
#              ("I… guess"). For a book that sets ellipses closed up instead.
#     space  — a plain space on both sides.
style:
  ellipsis: nbsp            # nbsp (house style) | closed | space
  # A paragraph whose double quotes do not balance — and whose successor does
  # not reopen with one, so it is not multi-paragraph speech — gets a margin
  # query. A question, never an edit; the one fully-missing closing quote in
  # the benchmark manuscript was invisible to every other pass.
  unclosed_quote_queries: true
  # Set heading-styled paragraphs (skip.sweep_only, "Heading*" by default) in
  # Chicago title case, as word-level tracked changes: "the shape of things
  # to come" -> "The Shape of Things to Come". All-caps headings and words
  # carrying their own capitals (McCoy, EVTOL) are left as styled. Free: no
  # API call, and no model ever reads a heading.
  heading_title_case: true
  # A heading that reads as the near-homophone of a standard book-part label
  # (AFTERWARD for AFTERWORD, FOREWARD for FOREWORD) gets a margin query.
  # A question, never an edit — "Afterward" is also a legitimate title.
  heading_vocab_queries: true

# A safety net against a model pass overstepping proofreading into rewriting.
# A proofreading fix is minimal by contract, so an edit that replaces a large
# span (a wholesale re-type) or adds a lot of new text (a fabricated clause or
# dialogue attribution) is rejected before it can become a tracked change, and
# counted so the rejection stays visible. Thresholds are characters of the
# minimal diff, after the shared prefix and suffix are trimmed.
edit_guard:
  enabled: true
  max_edit_chars: 64        # largest span, deleted or inserted, one fix may touch
  max_added_chars: 16       # most net new characters one fix may add (insert − delete)

# Deterministic sweeps, run before any model pass so their edits get first
# claim on a span. Each is one Atmosphere house rule expressed as text
# patterns, and each reports its own final match count — the thing a careful
# read can never honestly promise. Free: no API call, no tokens.
sweeps:
  - sweep_ellipsis
  - sweep_dash
  - sweep_stacked_punctuation
  - sweep_doubled_word
  - sweep_century
  - sweep_compound_number
  - sweep_dialogue_tag
  - sweep_terminal_period
  - sweep_quote_punctuation   # . and , inside a closing double quote (US)
  - sweep_nested_quote        # doubles inside dialogue demote to singles
  - sweep_time_of_day         # 3:40am -> 3:40 AM; 2 PM -> 2:00 PM (house: 11:00 AM)
  - sweep_deity_capital       # oh my god -> oh my God (set interjections only)
  - sweep_dialogue_splice     # comma splices around a dialogue tag
  - sweep_initialism          # whitelisted initialisms capitalized (tv -> TV)
  - sweep_decade_apostrophe   # the 80s -> the ’80s (the/early/late/mid leads only)
  - sweep_trailing_space      # paragraph-trailing spaces deleted (tracked)

# After every gate has settled which edits stand, re-scan the reviewed text
# for number-rule trigger sites no edit touched — bare numerals to one
# hundred, percent signs, digit ordinals — and raise each as a margin query.
# A rule applied to some-but-not-all matches erodes trust faster than a rule
# that is absent; this ends the run with the rule executed or accounted for.
# Free: no API call. See docproof/residuals.py.
residuals:
  enabled: true
  max_per_rule: 150         # overflow is logged loudly, never silently dropped

# Recurrence propagation: a free deterministic post-pass over the validated set.
# Every validated edit that swaps one verbatim word/short phrase for another is
# searched across the whole book, and each OTHER occurrence of the original
# surface is re-emitted as a finding proposing the same swap — a typo fixed in
# chapter 2 but missed in chapter 9 is now fixed in both. A surface the edits
# disagree about is dropped as ambiguous, a real dictionary word recurs as a
# margin query (not a silent edit), a non-word typo propagates as a tracked edit,
# and the protected lexicon is never swept. Whole-document only, no API call.
# See docproof/adjudicate.py (propagate_recurrences).
recurrence:
  enabled: true
  max_sites_per_surface: 200  # per surface; overflow logged, never silently dropped

# Phase-one examination graph. It observes the existing review and writes an
# append-only site ledger plus coverage reports; it CANNOT create edits in
# shadow mode. Roll back immediately by changing only `enabled` to false — the
# validator, tracked-change writer, and reviewed manuscript are otherwise the
# same path as before this feature.
examination_graph:
  enabled: true
  mode: shadow
  model_obligations: true   # one explicit pending obligation per paragraph/category;
                            # Phase 2 settles it only from an explicit response receipt
  production_verdicts: true # require each production reply to name every reviewed
                            # paragraph; unacknowledged work remains pending
  spell_sites: true         # site each unknown-word occurrence from spellscan
  max_sites: 200000         # cap is reported as omissions, never silently hidden
  write_ledger: true
  write_report: true
  ledger_filename: examination-ledger.jsonl.gz  # compressed for Fly volume retention
  report_json_filename: examination-coverage.json
  report_filename: examination-coverage.md
  evaluation_filename: examination-evaluation.json
  evaluation_key_filename: examination-evaluation-key.json
  # Phase 1B is a paid, independent second opinion over precise candidate
  # sites. It ships OFF until an administrator opts one Run-now job into the
  # experiment. Its verdicts never enter the manuscript path.
  judgment:
    enabled: false
    primary_model: gpt-5.6-luna
    primary_effort: low
    escalation_model:
    escalation_effort: high
    batch_size: 100
    max_output_tokens: 16000
    max_missing_retries: 1
    max_sites: 2000
    max_cost_usd: 2.00
    sample_rate: 0.10
    eligible_generator_prefixes:
      - deterministic.spellscan
      - deterministic.adjudicate
    allow_legacy_obligations: false

# Explicit candidate generation and screening. Local generators create
# auditable potential error sites, strong local rules settle the inexpensive
# tail, and a compact model judge handles the ambiguous remainder. The shipped
# mode is off. `shadow` generates, screens, and writes a ledger/report without
# ever changing the document. `apply` would admit correction-validated error
# verdicts to the ordinary validator and tracked-change writer — but it is
# release-gated (P0-01): until the validation gates pass, any requested `apply`
# is contained to `shadow` (see docproof.config.resolve_candidate_mode / the
# CANDIDATE_APPLY_RELEASED gate and DOCPROOF_CANDIDATE_APPLY opt-in).
candidate_screening:
  mode: "off"                  # off | shadow | apply (apply gated to shadow)
  candidate_types:
    - dialogue_tag_punctuation
    - quote_balance
    - introductory_comma
    - direct_address_comma
    - number_style
    - currency_style
    - repeated_word
    - word_echo
    - heading_sequence
    - list_punctuation
    - punctuation_style     # semicolon/colon/bracket + adapted punctuation ERROR sweeps
    - homophone             # confusables, SIGNAL-GATED (misuse patterns only)
    - compound_sentence_comma  # comma before a two-clause coordinating join
    - term_consistency      # document-wide term/spelling drift (reused scan)
    - grammar               # LanguageTool mechanical floor (reused, opt-in)
    # - comma_boundary      # EXHAUSTIVE comma seams (low precision; judge prunes
    #                         the FPs). ~10x the candidate volume; opt in only
    #                         with batch: true and a house-style-aware judge.
  reuse_local_analyzers: true   # feed sweeps/quote/consistency scans as candidates
  languagetool_floor: false     # also run LanguageTool (heavy JVM); opt-in
  max_candidates: 200000
  batch_size: 40            # candidates per judge request; 100 invited ID slips
  judgment_enabled: true
  # Send the primary judgment as one vendor batch (50% cheaper). The lane
  # block-polls it to completion, then re-judges any unresolved packet on the
  # synchronous focused-retry path. Escalation stays synchronous.
  batch: false
  batch_poll_interval_seconds: 20
  batch_max_wait_seconds: 86400   # 24h vendor window; then drop to synchronous
  model: gpt-5.6-luna
  effort: low
  escalation_model:
  escalation_effort: high
  max_output_tokens: 16000
  max_missing_retries: 1
  max_cost_usd: 2.00
  write_ledger: true
  write_report: true
  ledger_filename: candidate-screening-ledger.jsonl.gz
  report_json_filename: candidate-screening-report.json
  report_filename: candidate-screening-report.md

# Ensemble review. Empty `detectors` (the default) is single-detector mode:
# api.model runs once, nothing is merged, no verifier runs — exactly the
# behaviour that shipped before. List two or more detectors to fan out: each
# reviews every chunk, their findings are merged by agreement (union, for
# recall), then a stronger `verifier_model` adjudicates before anything reaches
# the author (for precision). Two identical detectors is a self-ensemble; a
# different vendor each is the diverse one. Every detector's cost is the whole
# review over again, so this multiplies spend — the cost preview shows it.
ensemble:
  detectors: []             # e.g. [{model: gpt-5.6-luna}, {model: claude-haiku-4-5}]
                            # the "Ensemble review" UI switch turns this into a
                            # diverse pair; empty = single-detector mode
  verifier_model: gpt-5.6-luna  # adjudicates disputed findings for precision;
                            # only runs while detectors is non-empty, so this
                            # default is inert until the ensemble switch is on
  verifier_effort: high
  verify_policy: disputed   # disputed (only where detectors disagree) | all | none
  consensus_confidence_bump: false

tracked_changes_policy: abort   # abort | accept_all_first | ignore

# Rejecting every tracked change must reproduce the document as ingested.
# strict refuses to write a file that fails the check; warn writes it and says
# so; off skips it. This is the only thing that would catch text changed
# without a revision mark around it — which the accepted view cannot show you.
audit: strict               # strict | warn | off
output_dir: output
# Margin comments explaining applied edits. OFF by house choice: thousands of
# explanation notes overwhelm an author (the benchmark run wrote one per 24
# words), and every reason still lands in the change log beside its change.
# Genuine questions — continuity, fact check, name pairs, below-gate queries —
# are a separate channel and appear as comments regardless. Flip this on per
# run in the panel ("Explain applied edits in the margin") for a staff-review
# copy. The top-of-document protected-words note rides on this too; the same
# list, with counts, is always in the change log.
comments: false
# Beyond this many identical rule explanations (79 copies of the dash rule, in
# one measured run), only the first edit keeps its comment — with a count and
# a pointer at the change log, which lists every instance. The edits all
# stand; this collapses the note beside them. 0 keeps every comment.
comment_collapse: 3
# Two channels, never blurred: a tracked change is a correction the author
# accepts or rejects, a comment is a question that edits nothing. Query-only
# error types always land as comments; this decides whether findings below
# min_confidence join them in the manuscript, or stay in summary.md where only
# an editor sees them.
query_comments: true

# A correction the tool chose NOT to make — an edit a judge or the verifier
# withdrew (the "Not applied: …" note), a below-gate catch, an oversized fix.
# false keeps these OUT of the delivered document: they are recorded in the
# change log and findings.json, but the author reads the changes and the genuine
# queries, not a commentary on what was declined. true puts them back in the
# margin (then query_comments still governs the below-gate/oversized ones). A
# genuine query from an asking pass (continuity, fact-check, an unconverted
# number site) is unaffected and always shown.
not_applied_comments: false

# One comment at the very top of the reviewed file, naming the words the spell
# scan left out of the check (treated as the author's own and never flagged), so
# a proofreader sees what was taken on trust before reading a line. Rides on
# `comments`: with Word comments off, none of these are written either.
excluded_words_comment: true

# The second deliverable: a Word change log for the author, naming every
# correction and reason, the scripted-check counts, the queries, what was
# deliberately left alone, and what this pass did not reach.
change_log: true
revision_author: Atmosphere Press Proofreader

# The merge desk's per-lane author override (docproof merge; Finding.lane): a
# finding tagged with one of these lanes is attributed to the name here
# instead of revision_author, so a merged deliverable carries two tracked-
# change authors Word can filter between. A lane with no entry — including
# every finding outside a merged run — falls back to revision_author, so
# nothing here changes an ordinary run's output.
lane_authors:
  copyedit: Atmosphere Press Copy Editor
