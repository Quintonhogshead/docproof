api:
  model: claude-haiku-4-5
  provider: anthropic        # only consulted for models not in the catalog
  max_retries: 2
  max_output_tokens: 16000
  prompt_caching: true
  effort: medium             # low | medium | high | xhigh | max | null

chunking:
  token_budget: 2500        # soft target per chunk (attention quality, not capacity)
  hard_cap_tokens: 8000     # oversized paragraphs split at sentence boundaries beyond this
  min_paragraph_chars: 0    # 0 = review every non-empty paragraph, dialogue lines included; raise to skip short lines from model passes
  context_token_budget: 300 # read-only trailing context from the previous chunk so antecedents resolve (0 disables); billed per chunk

skip:
  styles:                   # skipped outright — not reviewed, not swept
    - "Title"               # (Word style IDs, fnmatch patterns)
    - "Subtitle"
    - "TOC*"                # a table of contents regenerates from the headings
    - "Caption"
  sweep_only:               # deterministic sweeps run, but no model pass
    - "Heading*"            # a chapter heading: "Chapter Twenty Four" -> "Twenty-Four"

# Manuscript prep: tagging a Word manuscript into a house InDesign style set.
# Both paths are relative to this file. THE STYLE SET IS house_styles.yaml —
# point these at another pair of files to prep for a different template.
prep:
  style_sheet: prep/house_styles.yaml
  tagging_prompt: prep/tagging.yaml
  max_paragraphs_per_window: 120   # one request per window
  token_budget: 6000               # ...whichever limit comes first
  context_paragraphs: 8            # already-labelled paragraphs sent for continuity
  preview_chars: 400               # how much of a long paragraph the model sees
  outputs: [indesign]              # indesign | tracked — the app overrides this
  strip_direct_formatting: true    # in the placed file only; italics always kept
  verify: true                     # refuse to ship a file whose words drifted

# Promo: a teaser and a set of social posts from a finished manuscript, written
# in one pass over the whole book. The prompt is a file — point generation_prompt
# elsewhere, or edit config/promo/generation.yaml, to change the voice or drop in
# the house copy specs. The model is NOT set here: promo reads api.model, so the
# app picks it per run and any vendor works. See docs/promo.md.
promo:
  generation_prompt: promo/generation.yaml
  plan_prompt: promo/marketing_plan.yaml   # the marketing plan — promo's 3rd deliverable, its own call
  post_count: 12                   # how many social posts to ask for
  max_input_tokens: 180000         # refuse a book too big for one pass, don't overflow
  outputs: [teaser, posts]         # teaser | posts — the app may override this
  verify: true                     # flag capitalised terms absent from the book (never blocks)
  verify_claims: false             # opt-in: a 2nd call checks each claim against the book (costs a re-read)
  verify_prompt: promo/verify.yaml

# The two edits made silently, outside the tracked-changes system, because
# neither is a content change an author needs to review. Applied before ingest,
# so every later stage measures against normalized text. Counted in the report
# but never logged line by line. Quote curling converts only what it can
# determine from the text and leaves the rest straight — a mark curled the
# wrong way ships, because there is no tracked change to reject.
normalize:
  quotes: true
  spaces: true

# A dictionary scan that never corrects anything. It sorts every unknown word:
# words written as NAMES become a do-not-flag list sent to every pass (what
# stops a coined name being "corrected" into the word it resembles); words that
# come apart into an ordinary word plus an ending English does not give it
# (growed → grow, layed → lay) and words used only seldom are handed to the
# model to look at; words merely repeated are passed on as evidence, not
# protection — because a misspelling the author believes in repeats just as
# faithfully as a coinage. Needs the optional `spylls` package; without it the
# scan is skipped and the passes run as before.
spellcheck:
  enabled: true
  # Unset means "whatever `variant` asks for", which is almost always right.
  # spylls bundles en_US only, so a uk/ca/au run has no dictionary unless you
  # point this at an .aff/.dic pair of your own (a path, without the
  # extension). Checking British spelling against a U.S. word list would file
  # every correct "colour" as unknown, so the scan declines instead.
  dictionary:
  min_occurrences: 2        # seen this often → "used throughout" (evidence for the
                            # model), not protection; seen less → raised to look at
  suggestion_limit: 25      # candidates given dictionary guesses (~0.25s each)
  allowlist: []             # always correct for this house, whatever the dictionary says
  # Spellings the house never accepts → their correction. Never protected by
  # repetition; the fix is given directly (the right form is often two words an
  # edit-distance search cannot reach). Set to {} to disable.
  denylist:
    alot: a lot
    aswell: as well
    infact: in fact
    eachother: each other
    atleast: at least
    incase: in case
    everytime: every time
    abit: a bit
    inspite: in spite
    ofcourse: of course

# One term written more than one way — blood-cursed against bloodcursed, safe
# keeping against safekeeping. The rule per-paragraph review structurally
# cannot do: a model reading chapter 4 has no idea what chapter 40 said. For
# terms it asks and never corrects, because the same test that finds an
# inconsistency cannot tell one from a distinction (awhile and a while differ
# in meaning), and which form a book uses is the author's to settle.
# Proper names get one bounded exception: a capitalized word that never
# appears lowercased and differs from another only in its diacritics — Rian
# against Rían — is one name, not two meanings. When one spelling clearly owns
# the book (name_dominance times as many, name_min_count seen, never in one
# sentence with a stray), the strays are corrected as tracked changes the
# author can still reject; below that bar they are asked about like any term.
# Whole-document runs only. Free: no API call.
consistency:
  enabled: true
  min_length: 7             # shorter keys collide by accident
  min_dominance: 2          # how far the majority must lead; 1 flags even splits
  names: true               # proper-name diacritic scan (Rian -> Rían)
  name_dominance: 5         # majority lead before a stray is corrected, not asked
  name_min_count: 20        # how established the dominant spelling must be

# A strong model reads the whole manuscript once, before the detector passes,
# and returns the book's proper nouns (canonical casing) + suspected
# misspellings — including valid-word-for-valid-word errors (calvary/cavalry)
# that a dictionary and a frequency signal both miss. Suspects become
# adjudication candidates (ruled on in context); casing feeds a query-channel
# drift check. One cacheable read; priced for its own (frontier) model.
glossary:
  enabled: true
  model: gpt-5.6-luna       # any catalog id; the app panel offers a picker.
                            # Luna is cheap (~$0.04/book) and catches the obvious
                            # real-word errors; a frontier model (Opus) adds the
                            # subtle semantic tail at ~40x the cost — pick per book.
  effort: medium
  max_output_tokens: 8000
  cache_dir:                # a path pins the read per draft (keyed by text+model+
                            # prompt): re-runs of an unchanged draft skip the cost
                            # and see the SAME glossary, so case-drift stops
                            # wobbling run to run. Unset = no cache.
  case_drift: true          # raise proper-noun casing drift as margin queries
  case_drift_scan: true     # discover strays across the whole book (not just the
                            # variants the model self-reports); leading article
                            # normalised out so "the Upper City" is never flagged
  case_edit_dominance: 5    # a multi-word name leading its strays this many to
                            # one (and seen case_edit_min_count+ times) corrects
                            # the stray as a tracked change; otherwise it asks
  case_edit_min_count: 8

# The whole-book story sheet: one read that gives the detector passes the
# narrative facts a per-paragraph check cannot know — who narrates, in what
# person and tense, and each character's pronouns — injected into every
# detector's system prompt (cached per document, like the vocabulary). It lets a
# paragraph-in-isolation pass catch a pronoun, name, or tense that is wrong for
# the STORY (his/her, I/you, a tense slip), the wrong-word errors it otherwise
# glides over. Off by default: a whole extra read, opt-in until proven.
# Whole-document only. See docproof/storysheet.py.
storysheet:
  enabled: false
  model: gpt-5.6-luna
  effort: medium
  max_output_tokens: 4000
  cache_dir:                # a path pins the read per draft (text+model+prompt)

# Whole-book continuity read: one frontier read of the entire manuscript that
# flags facts the book contradicts about itself — timeline slips, age/date
# arithmetic, attribute drift, object continuity. Query-only by design: every
# finding is a margin comment, never a tracked change (which fact is right is the
# author's call). A deterministic date->weekday checker rides along at no API
# cost. OFF by default until proven on a real-manuscript compare, like rewrite.
# Whole-document only. See docproof/continuity.py.
continuity:
  enabled: false
  model: claude-fable-5     # frontier work; opus-5 half-price, sonnet-5 cheaper
  effort: high
  max_output_tokens: 8000
  max_queries: 40           # cap on margin comments; most significant first
  min_confidence: medium    # drop "low" — a wrong continuity flag costs trust
  calendar_check: true      # deterministic date->weekday math; no API, query-only
  max_input_tokens: 400000  # refuse a book too big for one read — never truncate
  cache_dir:                # a path pins the read per draft (text+model+prompt)

# Multi-round review: review the manuscript `count` times, each round reading the
# previous round's corrected text, with a strong judge ruling on every correction
# between rounds. All approved changes are composed into one tracked-change file
# against the original. count 1 = a single ordinary review (default, inert).
rounds:
  count: 1
  judge_model: gpt-5.6-sol # the between-round judge; picked per job in the panel
  judge_effort: high
  judge_prompt: ""         # empty = built-in default (editable in the review panel)
  min_new_edits: 1         # stop early once a round approves fewer than this
  reuse_whole_book_reads: true

# Real-word typos the plain passes glide over (staired, a protected repeated
# misspelling), found by local signals and ruled on by the model in context.
# Only a high-confidence affirmed fix becomes a tracked change; softer calls are
# margin queries — so a wrong candidate costs at most a question. Whole-doc only.
adjudicate:
  enabled: true
  near_miss_gap: 2.5         # zipf lead a common word needs to un-protect a coinage
  min_word_len: 4           # short tokens are too edit-close to judge cheaply
  max_candidates: 500       # bound on sites sent to the model, logged when it bites
  batch_size: 40            # candidates per adjudication request
  edit_confidence: high     # at/above this an affirmed fix edits; softer -> query

# Rewrite-then-diff: the model retypes each paragraph minimal-edit, the diff
# against the source becomes candidates, and a skeptical confirm pass rules on
# each in context (high -> tracked edit, softer -> margin query, keep -> nothing).
# Reshapes detection into generation to surface the missing-word / letter-typo /
# agreement misses the detector glides over. OFF by default: a strong recall
# lever but a whole extra (output-heavy) pass in cost, shipping opt-in until
# proven on a real-manuscript compare. Whole-document only. The retype calls
# RIDE THE BATCH when `model` matches api.model (the default) — half price, and
# clear of the sync rate-limit wall; only the light confirm runs at collect.
# A different `model` cannot share the one-model batch, so it falls back to
# synchronous retyping at collect. See docproof/rewrite.py.
rewrite:
  enabled: false
  model:                    # unset = api.model (the detector's); a cheap one is plenty.
                            # Set it to a DIFFERENT model and the retype runs sync
                            # (can't share the review's batch), losing the discount.
  effort: medium
  max_output_tokens: 8000
  max_span: 48              # a diff whose delete or insert exceeds this is a paraphrase
  max_added: 24             # ...or that adds more than this many net chars — dropped
  samples: 1                # independent retypes per chunk, unioned. >1 lifts recall
                            # (a stochastic retype misses different errors each pass);
                            # each extra sample is another whole retype in cost
  diverse: true             # point each sample at a different error class (small
                            # omissions, agreement, ...) instead of asking twice;
                            # covers more at the same cost. No effect at samples=1
  workers: 8               # concurrency for the SYNC path only (run_sync, or the
                            # different-model fallback); the batch handles its own
  batch_size: 40            # candidates per confirm request
  edit_confidence: high     # at/above this an affirmed fix edits; softer -> query
  confirm_model:            # unset = the rewrite model confirms its own diffs. A
                            # stronger id here (any vendor) gates recall better for
                            # little cost — confirm prompts are short. Runs sync.
  confirm_effort: medium
  log_rejects: false        # write confirm's kept-as-not-an-error candidates to
                            # rewrite_rejects.json (diagnostic; batch collect only)

# LanguageTool mechanical-floor pass: a LOCAL rules-based checker (no network, no
# per-call cost, no client text egress) that proposes commas / missing words /
# compound-modifier hyphenation the model glides past, then routes each through
# the SAME confirm valve as rewrite (high=edit, soft=query, keep=nothing) — so it
# never edits blind. Orthogonal to the LLM (~5% catch overlap); ~+6pt tracked-edit
# recall on the mechanical tail at ~$0.01/book (confirm only). Needs Java + the
# LanguageTool jar (auto-downloaded, cached), so OFF by default. Whole-document
# only. See docproof/languagetool.py.
languagetool:
  enabled: false
  dictionary: en-US         # LanguageTool language code (en-US | en-GB | …)
  disabled_rules: []        # extra rule ids to drop, atop the built-in
                            # artifact/style denylist (unpaired-quote, caps-start,
                            # whitespace, style advice)
  max_output_tokens: 4000   # ceiling per confirm request (verdicts are terse)
  batch_size: 40            # candidates per confirm request
  edit_confidence: high     # at/above this an affirmed fix edits; softer = query
  confirm_model:            # unset = api.model confirms; a cheap model is plenty
  confirm_effort: medium

# Sapling.ai grammar/spell pass — a hosted checker whose suggestions fold into
# the tracked changes after the sweeps and the model. Off by default and opt-in
# per run; needs SAPLING_API_KEY in the environment. See docproof/sapling.py.
sapling:
  enabled: false
  variety: ""               # "" | us-variety | gb-variety | au-variety | ca-variety
  comments: true            # false = apply Sapling edits silently, no margin comment
  cost_per_1k_chars: 0.025  # $ per 1,000 chars — for the pre-run estimate only

# Fallback $/MTok rates for the cost estimate, used only when api.model is not
# in docproof/providers/catalog.py (which carries per-model rates). Leave unset
# to omit the estimate for unknown models.
pricing:
  input_per_mtok: null
  output_per_mtok: null

# Which English this manuscript is written in: us | uk | ca | au. It flips the
# conventions that differ by variant — which mark opens dialogue, decade
# apostrophes, percent vs per cent, date and time formats, the that/which rule
# — and picks the spell-scan dictionary. Stated, never inferred: guessing and
# then applying the guess silently is how a U.K. book comes back Americanized.
# Canadian and Australian are hybrids, so their change logs ask the press to
# confirm. See config/variants/ and docs/variants.md.
variant: us

min_confidence: medium      # low | medium | high — gate for applying changes

# What happens to a model edit that falls BELOW min_confidence. Left off, the
# gate's original behaviour holds: a below-gate edit never auto-applies and (with
# query_comments on) shows only as a margin comment. The type prompts mark
# anything in dialogue "low" on purpose, which also strands real dialogue
# mechanics there. With confirm on, each below-gate edit is re-ruled by an LLM in
# context through the SHARED rewrite.confirm valve — affirmed at edit_confidence
# it becomes a tracked change, a softer affirmation a margin query, a "not an
# error" verdict is dropped. Recovers the genuine catch without lowering the gate
# for everything. A paid pass; off until measured on the recall harness, like
# rewrite/languagetool/sapling. See docproof/pipeline._promote_low_confidence.
low_confidence:
  confirm: false
  edit_confidence: high     # the bar an affirmed below-gate edit clears to apply
  batch_size: 40            # candidates per confirm request
  max_output_tokens: 4000
  # Unset = the detector's own model confirms. A stronger model here is cheap
  # (the prompts are short) and is the point of a separate confirm valve.
  confirm_model:
  confirm_effort: medium

# Each entry is ONE API pass over the whole document. A bare key runs alone;
# a list runs as a single combined pass, so the document is sent once for the
# whole group instead of once per type. Related types are grouped together —
# defining comma_splice and run_on_sentence side by side sharpens the boundary
# between them. Precision order matters: the validator keeps the first edit to
# claim a span, so the most objective types run first.
error_types:
  # mechanical — objective, verifiable, low false-positive rate
  - [repeated_word, spelling, homophone_confusion, apostrophe_error, capitalization]
  # house commas — one Atmosphere house-guide rule each
  - [serial_comma, complex_list_semicolon, introductory_comma,
     direct_address_comma, tag_question_comma]
  # dialogue mechanics — the highest-volume error class in fiction, and the
  # one with the most detailed rule table. speaker_change rides along because
  # it reads the same paragraphs for the same reason, and asks rather than
  # corrects.
  - [dialogue_tag, speaker_change]
  # house mechanics — numbers, money, hyphenation, and the one rule that
  # changes how text is set rather than what it says
  - [number_style, currency_style, ly_adverb_hyphen, title_italics]
  # sentence grammar — needs parsing, still decidable
  - [comma_splice, run_on_sentence, subject_verb_agreement, that_which]
  # judgment calls — style-sensitive, most likely to fire on deliberate prose
  - [tense_shift, pronoun_agreement, missing_word, preposition_error]
# House-style conventions the sweeps enforce where the right answer is the
# press's choice, not a rule. Not in config/variants/ because none of it flips
# on US/UK — a house sets it once for every manuscript.
#   ellipsis: how an ellipsis sits against its neighbours.
#     nbsp   — a non-breaking space before it, a plain space after. The
#              Atmosphere house convention (Bad[NBSP]… she trailed off).
#     closed — no space before it, a plain space after when a word follows
#              ("I… guess"). For a book that sets ellipses closed up instead.
#     space  — a plain space on both sides.
style:
  ellipsis: nbsp            # nbsp (house style) | closed | space

# A safety net against a model pass overstepping proofreading into rewriting.
# A proofreading fix is minimal by contract, so an edit that replaces a large
# span (a wholesale re-type) or adds a lot of new text (a fabricated clause or
# dialogue attribution) is rejected before it can become a tracked change, and
# counted so the rejection stays visible. Thresholds are characters of the
# minimal diff, after the shared prefix and suffix are trimmed.
edit_guard:
  enabled: true
  max_edit_chars: 64        # largest span, deleted or inserted, one fix may touch
  max_added_chars: 16       # most net new characters one fix may add (insert − delete)

# Deterministic sweeps, run before any model pass so their edits get first
# claim on a span. Each is one Atmosphere house rule expressed as text
# patterns, and each reports its own final match count — the thing a careful
# read can never honestly promise. Free: no API call, no tokens.
sweeps:
  - sweep_ellipsis
  - sweep_dash
  - sweep_stacked_punctuation
  - sweep_doubled_word
  - sweep_century
  - sweep_compound_number
  - sweep_dialogue_tag
  - sweep_terminal_period

# Ensemble review. Empty `detectors` (the default) is single-detector mode:
# api.model runs once, nothing is merged, no verifier runs — exactly the
# behaviour that shipped before. List two or more detectors to fan out: each
# reviews every chunk, their findings are merged by agreement (union, for
# recall), then a stronger `verifier_model` adjudicates before anything reaches
# the author (for precision). Two identical detectors is a self-ensemble; a
# different vendor each is the diverse one. Every detector's cost is the whole
# review over again, so this multiplies spend — the cost preview shows it.
ensemble:
  detectors: []             # e.g. [{model: gpt-5.6-luna}, {model: claude-haiku-4-5}]
  verifier_model:           # null = no verifier; a stronger model when set
  verifier_effort: high
  verify_policy: disputed   # disputed (only where detectors disagree) | all | none
  consensus_confidence_bump: false

tracked_changes_policy: abort   # abort | accept_all_first | ignore

# Rejecting every tracked change must reproduce the document as ingested.
# strict refuses to write a file that fails the check; warn writes it and says
# so; off skips it. This is the only thing that would catch text changed
# without a revision mark around it — which the accepted view cannot show you.
audit: strict               # strict | warn | off
output_dir: output
comments: true              # margin comment on every tracked change
# Two channels, never blurred: a tracked change is a correction the author
# accepts or rejects, a comment is a question that edits nothing. Query-only
# error types always land as comments; this decides whether findings below
# min_confidence join them in the manuscript, or stay in summary.md where only
# an editor sees them.
query_comments: true

# One comment at the very top of the reviewed file, naming the words the spell
# scan left out of the check (treated as the author's own and never flagged), so
# a proofreader sees what was taken on trust before reading a line. Rides on
# `comments`: with Word comments off, none of these are written either.
excluded_words_comment: true

# The second deliverable: a Word change log for the author, naming every
# correction and reason, the scripted-check counts, the queries, what was
# deliberately left alone, and what this pass did not reach.
change_log: true
revision_author: Atmosphere Press Proofreader
