key: us
name: U.S. English
dictionary: en_US
primary_quote: double

# Spellings the en_US dictionary ACCEPTS but that are another variant's — the
# dictionary will never flag them, so each occurrence goes to the adjudication
# pass, which converts ordinary prose and keeps proper names (Mr. Grey, the
# Aldwych Theatre) and verbatim quoted matter. Curated for words that are
# unambiguously British in running U.S. prose; a press can extend it here.
respell:
  grey: gray
  greys: grays
  greyed: grayed
  greying: graying
  greyish: grayish
  greyer: grayer
  greyest: grayest
  traveller: traveler
  travellers: travelers
  travelled: traveled
  travelling: traveling
  cancelled: canceled
  cancelling: canceling
  labelled: labeled
  labelling: labeling
  modelled: modeled
  modelling: modeling
  marvellous: marvelous
  jewellery: jewelry
  counsellor: counselor
  counsellors: counselors
  woollen: woolen
  whilst: while
  learnt: learned
  spelt: spelled
  leant: leaned
  spoilt: spoiled
  theatre: theater
  theatres: theaters
  centre: center
  centres: centers
  aeroplane: airplane
  aeroplanes: airplanes
  moustache: mustache
  moustaches: mustaches
  pyjamas: pajamas
authorities:
  - The Chicago Manual of Style, 17th edition
  - Merriam-Webster, for spelling
  - The Atmosphere Press House Style Guide, which overrides Chicago where they differ

conventions: |
  Quotation marks: double (“…”) for primary dialogue, single (‘…’) for a
  quotation nested inside one.
  Short-work titles: double quotes — “The Tell-Tale Heart”, “Hey Jude”.
  Times: 8:30 a.m. / 5:00 p.m. — lowercase, with periods, colon separator.
  Ranges take an unspaced en dash: 9:00–5:00 p.m.
  Dates: July 14, 1989 — comma after the day, and after the year if the
  sentence continues. No ordinals in a formal date: 24 July, never 24th July.
  Decades: ’60s — apostrophe before, no apostrophe before the s.
  That / which: the strict Chicago distinction. "that" introduces a
  restrictive clause and takes no comma; "which" introduces a nonrestrictive
  one and is set off by commas.
  Percent: one word, "percent". The % symbol belongs in data tables only.
  Punctuation with quotation marks: periods and commas go INSIDE the closing
  quote, whether or not they belong to the quoted material.
  Spelling: Merriam-Webster — color, organize, traveled, center.
