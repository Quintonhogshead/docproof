key: number_style
name: Number style
version: 2

detection_prompt: |
  The Atmosphere house guide spells out one through one hundred in prose and
  uses numerals from 101 up. Ordinals in prose are spelled out too. Centuries
  are always spelled out. Cancer stages are set in ROMAN numerals. Clock times
  are set as digits with minutes and a capital meridiem ("11:00 AM"). Simple
  fractions are spelled out and hyphenated when adjectival. Thousands take a
  comma.

  FLAG:
  - A bare integer from 1 to 100 in ordinary prose: "She waited 20 minutes.",
    "There were 8 of them."
  - An ordinal numeral in ordinary prose: "the 4th floor" -> "the fourth
    floor", "his 3rd attempt" -> "his third attempt", "the 42nd day" -> "the
    forty-second day". Word often sets the suffix ("th", "st") in superscript;
    that formatting does not change the rule — it is the same error.
  - A hyphenated duration, distance, or weight modifier in narration: "a
    25-minute wait" -> "a twenty-five-minute wait", "a 30-minute ride", "a
    5-mile radius", "a 5-pound bag". These are prose, not measurements — the
    measurement carve-out below is for abbreviated technical units only.
  - Day, week, and grade counters in narration: "day 1" -> "day one", "It's
    day 2" -> "It's day two", "in week 7" -> "in week seven". These read as
    prose counters, not labels, in a memoir or novel.
  - A quantity with a trailing plus: "5+ glasses" -> "five-plus glasses".
  - Ages, including a decade of life: "a 50-year-old woman", "over 50 years
    old", "in her 60s" -> "in her sixties". (A CALENDAR decade — "the ’80s",
    "the 1990s" — keeps its numerals; see below.)
  - Centuries written with an ordinal numeral: "20th century",
    "21st-century medicine".
  - A cancer stage in Arabic digits or spelled out: "stage 4 cancer" ->
    "stage IV cancer", "stage four liver cancer" -> "stage IV liver cancer".
    House sets cancer stages in Roman numerals — the ONE context where this
    type's direction runs toward numerals. Only cancer staging: other medical
    and technical labels ("type 2 diabetes", "grade 3") keep Arabic digits
    and are not flagged.
  - Simple fractions as digits in prose: "2/3 of the class".
  - A four-digit-or-larger quantity missing its thousands comma: "1000 people",
    "12500 miles". (Years are exempt — see below.)

  Do NOT flag — these are legitimate numeral contexts and the house guide
  leaves them alone:
  - Dates and years: "July 14, 1989", "in 1997", "the 1990s".
  - Times, including a BARE clock hour: "8:30 AM", "at 5:00", "around 4",
    "the meeting starts at 8". The house time form is digits with minutes and
    a capital meridiem ("11:00 AM") — a deterministic sweep normalizes the
    meridiem and the whole-book consistency scan owns bare hours, so never
    spell a clock time out and never restyle one yourself.
  - Money, which the currency_style type owns entirely.
  - Percentages: "40 percent".
  - Addresses, house and room numbers: "12 Oak Street", "room 4".
  - Chapter, page, verse, section, and figure numbers.
  - Medical and technical type/grade labels: "type 2 diabetes", "grade 3".
    The numeral IS the label; spelling it out is a wrong edit the head
    proofreader reverses. (Cancer STAGES are the exception — they convert to
    Roman numerals; see FLAG above.)
  - Measurements and data with ABBREVIATED or technical units: "10 kg",
    "30°C", "a 9mm round". A spelled-out everyday unit in narration
    ("20 minutes", "a 5-mile radius") is prose and IS flagged — see above.
  - Phone numbers, serial numbers, ID numbers, scores, and statistics.
  - Form fields, dossiers, tables, inventories, and any quoted document where
    the numerals are part of the artifact.
  - CALENDAR decades: "the '60s", "the 1990s". The numerals are correct, and
    a missing apostrophe ("the 80s") is the decade sweep's to add. A decade
    of someone's AGE ("in her 60s") is not a calendar decade — that one is
    spelled out; see FLAG above.
  - Numerals of 101 and above in prose — those are already house style.
  - Numbers already spelled out. NEVER convert a spelled-out number to
    numerals — not for 101-and-up, not for round quantities ("ten thousand
    rounds" stays as written; Chicago spells round large numbers), and never
    inside dialogue or a spoken transcript, where spelled-out numbers are
    always correct. The single exception is a cancer stage, which converts to
    Roman numerals wherever it sits — see FLAG above. Everything else runs
    numerals → words only.
  - A character reciting digits aloud — a phone number, a combination, a
    countdown — where the numerals are the point.

fix_guidance: |
  corrected_text must repeat the entire sentence with the number spelled out
  and nothing else changed. Hyphenate compound numbers from twenty-one through
  ninety-nine. Spell ordinals as words ("the fourth floor", "his third
  attempt"), hyphenating compounds ("the forty-second day"). Hyphenate an age
  used attributively before a noun ("a fifty-year-old woman") and leave it
  open in the predicate ("over fifty years old"). Spell centuries as ordinals
  in words ("twentieth century"). Set a cancer stage in capital Roman
  numerals ("stage IV"), changing nothing but the stage number. Hyphenate a
  fraction used adjectivally ("a two-thirds majority"). For a missing
  thousands comma, insert only the comma.

confidence_guidance: |
  high   — a bare integer 1–100 or an ordinal numeral in plain narration with
           no numeral context in sight, an ordinal-numeral century, or a
           cancer stage with the disease named nearby.
  medium — the context could be a legitimate-numeral one (a measurement, a
           tally, a form, an address or proper name for an ordinal) depending
           on how the surrounding scene reads.
  low    — the numerals appear in dialogue, a quoted document, or a passage
           where the digit form looks deliberate.

examples:
  - text: "She waited 20 minutes before anyone came to the door."
    finding:
      original_text: "She waited 20 minutes before anyone came to the door."
      corrected_text: "She waited twenty minutes before anyone came to the door."
      explanation: "House style spells out numbers one through one hundred in prose."
      confidence: high
  - text: "The letter was postmarked July 14, 1989."
    finding: null
  - text: "Back to the 4th floor."
    finding:
      original_text: "Back to the 4th floor."
      corrected_text: "Back to the fourth floor."
      explanation: "House style spells out ordinals in prose."
      confidence: high
  - text: "He collected 20th century pulp magazines."
    finding:
      original_text: "He collected 20th century pulp magazines."
      corrected_text: "He collected twentieth century pulp magazines."
      explanation: "House style spells out centuries."
      confidence: high
  - text: "A 50-year-old woman answered the door."
    finding:
      original_text: "A 50-year-old woman answered the door."
      corrected_text: "A fifty-year-old woman answered the door."
      explanation: "Ages are spelled out and hyphenated before the noun."
      confidence: high
  - text: "The recipe called for 250 grams of flour."
    finding: null
  - text: "I'm standing for this 25-minute wait."
    finding:
      original_text: "I'm standing for this 25-minute wait."
      corrected_text: "I'm standing for this twenty-five-minute wait."
      explanation: "A duration modifier in prose is spelled out and hyphenated."
      confidence: high
  - text: "Day 1 is here, and I'm pumped."
    finding:
      original_text: "Day 1 is here, and I'm pumped."
      corrected_text: "Day one is here, and I'm pumped."
      explanation: "A day counter in narration is spelled out."
      confidence: high
  - text: "He has stage four liver cancer that has metastasized to his lungs."
    finding:
      original_text: "He has stage four liver cancer that has metastasized to his lungs."
      corrected_text: "He has stage IV liver cancer that has metastasized to his lungs."
      explanation: "House style sets cancer stages in Roman numerals."
      confidence: high
  - text: "She manages her type 2 diabetes with diet alone."
    finding: null
  - text: "We will start getting ready around 4."
    finding: null
