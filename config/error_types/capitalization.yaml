key: capitalization
name: Capitalization
version: 1

detection_prompt: |
  A letter that should be capitalized and is not, or is capitalized and should
  not be.

  FLAG:
  - A sentence beginning with a lowercase letter after a period, question
    mark, or exclamation point: "He left. the door stayed open."
  - The pronoun "i" written lowercase: "then i saw her".
  - A proper noun in lowercase: "we drove through texas in january",
    "she spoke french".
  - A random interior capital from a stuck shift key: "the Door swung open",
    "he WAlked away".
  - A kinship term used AS a name — as direct address, or standing where the
    person's name would — written lowercase: "Yes, father." → "Father",
    "I asked mom where she'd been." → "Mom", "Did grandmother know?" →
    "Grandmother". The test is substitution: if the name could replace the word
    ("Yes, Sarah."), it is a name and takes a capital.
  - A title of address used TO address someone, written lowercase: "As you
    wish, your majesty." → "Your Majesty", "Thank you, your highness." →
    "Your Highness", "Right away, captain." → "Captain".

  Do NOT flag:
  - A kinship term used as an ordinary noun, not as a name: preceded by a
    possessive (my, his, her, your, their, its) or an article (the, a, an), or
    otherwise describing rather than naming. "my father", "her mom", "the aunt
    he never met", "a grandmother of four" all stay lowercase. The possessive or
    article is the tell — a name never takes one.
  - A title used to describe or refer to someone rather than to address them:
    "the captain gave the order", "she wanted to be queen", "he served the
    king". Only the direct-address or naming use is capitalized; leave the
    descriptive use alone.
  - Stylized lowercase used consistently: a character who texts in lowercase,
    poetry, a brand name like "iPhone" or "eBay", an author who lowercases a
    word deliberately. If a word is lowercase in more than one place, treat it
    as intentional.
  - The first word after a colon, which may be either case.
  - Continuation after an ellipsis or em dash, where lowercase is correct:
    "I thought— no, never mind."
  - Dialogue resuming after an interrupting attribution: "I know," she said,
    "and I don't care." — the "and" is correctly lowercase.
  - A capitalized pronoun in a dialogue tag: "Wait here." He said. The
    dialogue_tag type owns that case, because there the capital and the
    punctuation before it are one defect and get fixed together. Leave it
    entirely alone here, even when you are certain the capital is wrong.
  - Seasons ("summer"), directions used as directions ("we drove north"),
    common nouns that resemble titles ("the president of the club"), and
    job titles used generically.
  - Invented or fantasy proper nouns, however they are cased.
  - Words in all caps for emphasis or shouting, in narration or dialogue.

fix_guidance: |
  corrected_text must repeat the entire sentence with only the offending
  letter's case changed. Never change the case of more than one word per
  finding, and never add or remove punctuation.

confidence_guidance: |
  high   — sentence-initial lowercase after terminal punctuation, lowercase
           "i" as a pronoun, or a well-known proper noun in lowercase.
  medium — the word may be a title or a common noun depending on usage.
  low    — the casing may be a style choice, appears in dialogue or a quoted
           artifact, or the word may be an invented name.

examples:
  - text: "The room was empty. he closed the door behind him."
    finding:
      original_text: "The room was empty. he closed the door behind him."
      corrected_text: "The room was empty. He closed the door behind him."
      explanation: "New sentence should begin with a capital letter."
      confidence: high
  - text: "By then i had stopped counting."
    finding:
      original_text: "By then i had stopped counting."
      corrected_text: "By then I had stopped counting."
      explanation: "The pronoun \"I\" is always capitalized."
      confidence: high
  - text: "\"I know,\" she said, \"and I don't care.\""
    finding: null
  - text: "We spent september in paris."
    finding:
      original_text: "We spent september in paris."
      corrected_text: "We spent September in paris."
      explanation: "Month names are capitalized."
      confidence: high
  - text: "The car drove north until the road ended."
    finding: null
  - text: "\"I already told you, mom.\""
    finding:
      original_text: "\"I already told you, mom.\""
      corrected_text: "\"I already told you, Mom.\""
      explanation: "\"Mom\" is direct address here, used as a name."
      confidence: high
  - text: "She had not seen her father in nearly ten years."
    finding: null          # a possessive precedes it: an ordinary noun, lowercase
  - text: "\"As you command, your majesty,\" the guard said."
    finding:
      original_text: "\"As you command, your majesty,\" the guard said."
      corrected_text: "\"As you command, Your Majesty,\" the guard said."
      explanation: "A title of address is capitalized: \"Your Majesty\"."
      confidence: high
  - text: "He had served the old king faithfully for thirty years."
    finding: null          # descriptive, not address — "king" stays lowercase
