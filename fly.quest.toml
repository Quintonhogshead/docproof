# Fly.io configuration for the standalone Spell & Check prototype site.
#
# Create the app with `fly apps create <app>`, set the one secret with
# `fly secrets set OPENAI_API_KEY=... -a <app>`, and deploy with
# `fly deploy -c fly.quest.toml`. This is a separate Fly app from
# atmosphere-docproof; the GitHub Actions auto-deploy does not touch it.

app = "spell-and-check"
primary_region = "iad"

# Headroom for Cover Studio's rare worst-case spikes (concurrent image
# downloads + a compose), on top of the 1GB below. Swap is slow but a slow
# render beats an OOM reboot that orphans every in-flight job.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile.quest"

[env]
  PORT = "8000"
  WAITLIST_PATH = "/data/waitlist.jsonl"
  COVER_DATA_PATH = "/data/cover"

# Waitlist signups live here and must survive restarts and scale-to-zero.
[[mounts]]
  source = "quest_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Nothing runs in the background here — scale to zero between visitors.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # 512mb served the skin generator fine but OOM-killed the box the first
  # time Cover Studio composited real covers (kernel log: anon-rss ~406MB at
  # the kill) — every kill reboots the machine and strands in-flight jobs as
  # "interrupted". Still scale-to-zero, so the upgrade costs pennies.
  memory = "1024mb"
