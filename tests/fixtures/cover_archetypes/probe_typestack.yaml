# TEST FIXTURE — not shipped content.
# A designed title effect stack (a tight shadow under a wide one) and NO recipe — the shape for layer-style tests that must not have finishing layers on top.
#
# Structurally derived from the retired `thriller_bigtype_silhouette` template, so every
# engine test that used to lean on that shipped archetype exercises the
# same shape without depending on what happens to be on the shelf. Edit
# this freely to serve a test; it ships to no one.
# ---------------------------------------------------------------------
# Research: BookCoverZone ("What Makes A Thriller Cover Sell In 2026"),
# CreativIndieCovers, and Rocking Book Covers all converge on the same
# rules, including a cited "silhouettes crush faces 3:1 in conversion rate"
# claim. Confidence: high (docs/cover_template_research.md #8) — arguably
# the single most locked-in convention in the whole research pass.
name: probe_typestack
genres: [mystery_thriller]
describe: >-
  Author name banner huge across the top, an even huger tight-tracked title
  filling the middle, one confined silhouette low in the frame — flat dark
  ground plus a single screaming accent color, no scrim, no scene.
composition_note: >-
  One hard-edged silhouette — a running or standing figure, a profile, or
  a single ominous object like a key or a door — confined to the lower
  quarter of the frame, on a single flat, dark, almost featureless ground.
  Never a detailed scene. No text anywhere.
art:
  - id: background
    generatable: true            # one dominant dark flat ground; procedural
    fit: cover                   # gradient is a fair $0 stand-in
  - id: focal
    generatable: true
    fit: contain
    transparent: true            # a hard-edged silhouette cutout
    # v2.1 BODY-fix wave: rises INTO the lower third instead of hugging the
    # base flush (anchor.y 1.0 -> 0.85) — a live render's silhouette sat so
    # low it read as a footnote instead of a presence; scale up (0.40 ->
    # 0.50) so it actually fills the lower third it now rises into.
    anchor: [0.5, 0.85]
    scale: 0.50
    # Effects rack (§7.4a): "silhouette" is this archetype's own name and
    # its single most locked-in research finding — thresholding to one flat
    # primary shape makes the hard edge structural instead of hoping the
    # generated cutout already reads that way.
    treatment: silhouette
  - id: texture
    generatable: false           # v2.1 BODY-fix wave: was plain film grain —
    opacity: 0.08                # halftone's print-dot screen reads more
    blend: overlay                # like a pulp-thriller jacket, still at a
    procedural: halftone         # low, barely-there opacity
text:
  - id: author
    zone: {x: 0.06, y: 0.05, w: 0.88, h: 0.085}
    case: upper
    tracking: 40                 # "nearly as large" as the title (research)
    size_min: 0.05
    size_max: 0.11
    max_lines: 2
  - id: subtitle
    zone: {x: 0.10, y: 0.14, w: 0.80, h: 0.028}
    optional: true
    size_min: 0.015
    size_max: 0.020
  - id: title
    # v2.1 BODY-fix wave: widened down (h 0.40 -> 0.48) so the title's own
    # block reaches further toward the now-larger, now-higher-rising
    # silhouette instead of stopping well short of it — center-valigned
    # (not bottom) so a SHORT title still fills the middle of its own zone
    # rather than clustering at the very bottom and opening a fresh gap
    # above itself.
    zone: {x: 0.05, y: 0.175, w: 0.90, h: 0.48}
    case: upper
    tracking: 20                 # tight-tracked, up to "70-80% of cover
    size_min: 0.07               # height" between title+author together
    size_max: 0.17
    max_lines: 2
    # Deep-stack wave (§15.4): the stacked double shadow — a tight, dark
    # contact shadow welding the huge caps to the ground, under a wide,
    # soft ambient one lifting them off it. The pro poster-type move the
    # effect stack exists for, and the research's "big bold capitalized
    # titles dominate the page" needs the type to sit IN the cover, not on
    # it. Stack order = paint order: the wide wash renders beneath the
    # tight edge.
    effects:
      - {kind: drop_shadow, dy: 0.012, blur: 0.025, alpha: 0.45}
      - {kind: drop_shadow, dy: 0.0025, blur: 0.002, alpha: 0.85}
layers: [background, texture, focal, author, subtitle, title]
