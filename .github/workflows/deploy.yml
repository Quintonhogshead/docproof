# Deploy the DocProof web process on every push to main. Galley book workers
# keep their image and command until an explicit worker release is requested.
#
# One-time setup (see DEPLOY.md): create a Fly deploy token with
#   fly tokens create deploy
# and paste it into this repo's GitHub secrets as FLY_API_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
#
# Worker releases restart an active phase. Request them only when the worker
# is idle or its operator has arranged checkpoint recovery.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_agent:
        description: "Also release Galley workers (restarts active books; coordinate recovery first)"
        required: false
        default: false
        type: boolean

# Serialize releases without cancelling a deployment that is already running.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The full config retains both process groups and their volumes. The
      # filter leaves active worker machines and their one-shot commands alone.
      - name: Deploy web app
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.include_agent }}
        run: flyctl deploy --remote-only --process-groups app
        env:
          # The token has been stored under both names in this repo's history;
          # accept either so a rename doesn't silently break the deploy. flyctl
          # reads FLY_API_TOKEN, so that name wins when both are set.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.FLY_API_KEY }}
      - name: Deploy web app and Galley workers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_agent }}
        run: flyctl deploy --remote-only --process-groups app,agent
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.FLY_API_KEY }}
