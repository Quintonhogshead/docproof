[project]
name = "docproof"
# Read from docproof/__init__.py — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "LLM-assisted grammar review with native Word tracked changes"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai>=2.0",
    "google-genai>=2.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Offline Hunspell for the spell scan, dictionary included. The scan is on
    # in the shipped config, and docproof degrades gracefully without it, but
    # a default that quietly does nothing is worse than a dependency.
    "spylls>=0.1.7",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
]
desktop = [
    "docproof[app]",
    "pywebview>=5.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",   # fixture generation only — never imported at runtime
    "httpx",              # fastapi TestClient
]

[project.scripts]
docproof = "docproof.__main__:main"
docproof-app = "app.run:main"
docproof-desktop = "app.desktop:main"
docproof-watch = "app.watch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "docproof.__version__"}

[tool.setuptools.packages.find]
include = ["docproof*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]