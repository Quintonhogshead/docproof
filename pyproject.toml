[project]
name = "docproof"
version = "0.1.0"
description = "LLM-assisted grammar review with native Word tracked changes"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "lxml>=5.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",   # fixture generation only — never imported at runtime
]

[project.scripts]
docproof = "docproof.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docproof"]