[project]
name = "docproof"
dynamic = ["version"]
description = "LLM-assisted grammar review with native Word tracked changes"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai>=2.0",
    "google-genai>=2.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Bundles the offline Hunspell dictionary used by the default spell scan.
    "spylls>=0.1.7",
    # Offline frequency data proposes candidates; the model adjudicates them.
    "wordfreq>=3.0",
    # Creates Word reports.
    "python-docx>=1.1",
    # Reads PDF annotations for the corrections engine.
    "pypdf>=5.0",
    # Word bounding boxes anchor PDF highlights accurately in justified text.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    # Required by Starlette's SessionMiddleware for signed session cookies.
    "itsdangerous>=2.0",
]
cover = [
    "pillow>=10.4",
]
desktop = [
    "docproof[app]",
    "pywebview>=5.0",
]
languagetool = [
    # Requires Java and downloads a cached jar on first use. The 3.x line uses
    # LTP_PATH for its cache (see fly.toml).
    "language_tool_python>=3.4,<4",
]
canvas = [
    # Canvas chat and cover generation use the local Claude Code login.
    # Deployments that generate covers must install this extra.
    "claude-agent-sdk>=0.2",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "httpx",              # fastapi TestClient
]

[project.scripts]
docproof = "docproof.__main__:main"
docproof-app = "app.run:main"
docproof-desktop = "app.desktop:main"
docproof-canvas = "app.canvas_desktop:main"
docproof-watch = "app.watch.cli:main"
docproof-admin = "app.admin:main"
docproof-serve = "app.serve:main"
spell-and-check = "app.quest_site:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "docproof.__version__"}

[tool.setuptools.packages.find]
# config/ ships in the wheel because resource_root() resolves shipped resources
# relative to the installed packages — a pip-installed server (the Docker web
# build) has no source checkout to fall back on.
include = ["docproof*", "app*", "config*", "galley*"]

[tool.setuptools.package-data]
app = ["static/*", "static/art/*", "static/canvas/*", "static/canvas/vendor/*"]
"galley.prompts" = ["*.md"]
config = ["*.yaml"]
"config.error_types" = ["*.yaml"]
"config.consistency" = ["*.tsv", "*.yaml"]
"config.prep" = ["*.yaml", "*.idml", "*.jsx"]
"config.prep.fonts" = ["*.ttf", "README.md"]
"config.prep.fonts.licenses" = ["*.txt"]
"config.promo" = ["*.yaml"]
"config.variants" = ["*.yaml"]
"config.cover" = ["*.yaml"]
"config.cover.archetypes" = ["*.yaml"]
"config.cover.recipes" = ["*.yaml"]
"config.cover.textures" = ["*.png", "*.jpg"]
"config.cover.fonts" = ["*.ttf", "*.txt", "*.md"]
