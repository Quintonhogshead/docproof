[project]
name = "docproof"
# Read from docproof/__init__.py — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "LLM-assisted grammar review with native Word tracked changes"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai>=2.0",
    "google-genai>=2.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Offline Hunspell for the spell scan, dictionary included. The scan is on
    # in the shipped config, and docproof degrades gracefully without it, but
    # a default that quietly does nothing is worse than a dependency.
    "spylls>=0.1.7",
    # Word-frequency data (bundled, offline) for the candidate-adjudication
    # pass: a real-word typo like "staired" (freq ~0) next to "stared" (common)
    # is invisible to a membership-only dictionary. wordfreq generates the
    # candidate; the model still adjudicates it in context, so nothing is
    # corrected on frequency alone.
    "wordfreq>=3.0",
    # The change log is a Word document the press hands to authors alongside
    # the manuscript. Everything else here edits .docx files that already
    # exist; this is the one thing docproof writes from nothing, and
    # hand-rolling OOXML for a report would be gratuitous.
    "python-docx>=1.1",
    # Reading a commented PDF proof (corrections engine): pure-Python, BSD, and
    # it reads the annotation layer — the comments and highlights the
    # corrections live in — not just the page text. No OCR, so a scanned proof
    # yields nothing and is reported as such rather than guessed at.
    "pypdf>=5.0",
    # The page geometry for the same proof: exact per-word bounding boxes, so a
    # highlight resolves to the words under it by intersecting rectangles instead
    # of estimating glyph advances from a font's /Widths (which drifts across
    # justified text and silently anchors a mark to the wrong words). MIT, and
    # pure-Python on top of pdfminer.six — no AGPL, unlike PyMuPDF.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    # Signed session cookies for the web build's sign-in (Starlette's
    # SessionMiddleware imports it). The desktop app never signs anyone in, but
    # it is one small pure-Python package and both builds install this extra.
    "itsdangerous>=2.0",
]
cover = [
    # Cover Studio's composer (docproof/cover/compose.py, typeset.py): the
    # only new dependency the feature needs — art direction and imaging reuse
    # the Provider protocol and the openai SDK, both already installed.
    "pillow>=10.4",
]
desktop = [
    "docproof[app]",
    "pywebview>=5.0",
]
languagetool = [
    # The local rules-based mechanical-floor pass (docproof/languagetool.py). Opt
    # in and off by default: enabling it also needs a Java runtime, and the
    # library downloads the LanguageTool jar (~260 MB, cached) on first use.
    # Pinned to the 3.x line: 3.3 relocated the jar-cache env var to LTP_PATH
    # (see fly.toml), so an unbounded pin risks another silent semantics shift.
    "language_tool_python>=3.4,<4",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "httpx",              # fastapi TestClient
]

[project.scripts]
docproof = "docproof.__main__:main"
docproof-app = "app.run:main"
docproof-desktop = "app.desktop:main"
docproof-watch = "app.watch.cli:main"
docproof-admin = "app.admin:main"
docproof-serve = "app.serve:main"
spell-and-check = "app.quest_site:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "docproof.__version__"}

[tool.setuptools.packages.find]
# config/ ships in the wheel because resource_root() resolves shipped resources
# relative to the installed packages — a pip-installed server (the Docker web
# build) has no source checkout to fall back on.
include = ["docproof*", "app*", "config*", "galley*"]

[tool.setuptools.package-data]
app = ["static/*", "static/art/*"]
# The auditor's system prompt, read at run time by galley/audit.py.
"galley.prompts" = ["*.md"]
config = ["*.yaml"]
"config.error_types" = ["*.yaml"]
# The consistency engine's spelling-variant table and Chicago preference notes.
"config.consistency" = ["*.tsv", "*.yaml"]
"config.prep" = ["*.yaml", "*.idml", "*.jsx"]
# The book-output fonts, embedded into book_*.docx files at write time.
"config.prep.fonts" = ["*.ttf", "README.md"]
"config.prep.fonts.licenses" = ["*.txt"]
"config.promo" = ["*.yaml"]
"config.variants" = ["*.yaml"]
# Cover Studio's archetype templates (docproof/cover/archetypes.py).
"config.cover" = ["*.yaml"]
"config.cover.archetypes" = ["*.yaml"]
# Cover Studio's stocked texture shelf (docproof/cover/textures.py, v2.2 wave).
"config.cover.textures" = ["*.png", "*.jpg"]
# Cover Studio's expansion font shelf: TTFs + per-family license texts +
# provenance README (docproof/cover/fonts.py, spec §15.11).
"config.cover.fonts" = ["*.ttf", "*.txt", "*.md"]