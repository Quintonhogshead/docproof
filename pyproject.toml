[project]
name = "docproof"
# Read from docproof/__init__.py — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "LLM-assisted grammar review with native Word tracked changes"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai>=2.0",
    "google-genai>=2.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Offline Hunspell for the spell scan, dictionary included. The scan is on
    # in the shipped config, and docproof degrades gracefully without it, but
    # a default that quietly does nothing is worse than a dependency.
    "spylls>=0.1.7",
    # The change log is a Word document the press hands to authors alongside
    # the manuscript. Everything else here edits .docx files that already
    # exist; this is the one thing docproof writes from nothing, and
    # hand-rolling OOXML for a report would be gratuitous.
    "python-docx>=1.1",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    # Signed session cookies for the web build's sign-in (Starlette's
    # SessionMiddleware imports it). The desktop app never signs anyone in, but
    # it is one small pure-Python package and both builds install this extra.
    "itsdangerous>=2.0",
]
desktop = [
    "docproof[app]",
    "pywebview>=5.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "httpx",              # fastapi TestClient
]

[project.scripts]
docproof = "docproof.__main__:main"
docproof-app = "app.run:main"
docproof-desktop = "app.desktop:main"
docproof-watch = "app.watch.cli:main"
docproof-admin = "app.admin:main"
docproof-serve = "app.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "docproof.__version__"}

[tool.setuptools.packages.find]
# config/ ships in the wheel because resource_root() resolves shipped resources
# relative to the installed packages — a pip-installed server (the Docker web
# build) has no source checkout to fall back on.
include = ["docproof*", "app*", "config*"]

[tool.setuptools.package-data]
app = ["static/*"]
config = ["*.yaml"]
"config.error_types" = ["*.yaml"]
"config.prep" = ["*.yaml"]
"config.variants" = ["*.yaml"]